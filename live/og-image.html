<!doctype html>
<!--
  공유 미리보기 그림(og-image.png, 1200×630)의 원본입니다. 사이트에는 올라가지 않습니다(build.sh 는 PNG 만 복사).
  고친 뒤 다시 만들기(Windows · Edge):
    msedge --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 ^
      --window-size=1200,630 --virtual-time-budget=8000 --screenshot=live\og-image.png live\og-image.html
  관람객 화면과 같은 말 · 색: 보라 띠(#5B45E0) · 남색 글자(#16203C) · 상태색(여유 #08773F · 보통 #F4D400 · 혼잡 #E52521).
  실제 부스처럼 읽힐 이름은 넣지 않습니다(그림 속 숫자는 모양을 보여 주는 보기).
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #5B45E0;
      color: #fff;
      display: grid;
      grid-template-columns: 1fr 380px;
      column-gap: 56px;
      align-items: center;
      padding: 0 80px;
      letter-spacing: -0.02em;
    }
    .event { font-size: 34px; font-weight: 600; color: rgba(255, 255, 255, .86); }
    .title { margin-top: 18px; font-size: 104px; font-weight: 800; line-height: 1.04; letter-spacing: -0.04em; }
    .lead { margin-top: 30px; font-size: 34px; font-weight: 500; line-height: 1.4; color: rgba(255, 255, 255, .9); }
    .url { margin-top: 44px; font-size: 24px; font-weight: 600; color: rgba(255, 255, 255, .7); letter-spacing: 0; }
    .tiles { display: grid; row-gap: 14px; }
    .tile { display: flex; align-items: baseline; justify-content: space-between; height: 128px; padding: 0 30px; align-items: center; }
    .tile b { font-size: 64px; font-weight: 800; letter-spacing: -0.04em; }
    .tile b small { margin-left: 2px; font-size: 30px; font-weight: 700; }
    .tile span { font-size: 34px; font-weight: 700; }
    .free   { background: #08773F; color: #fff; }
    .normal { background: #F4D400; color: #16203C; }
    .busy   { background: #E52521; color: #fff; }
  </style>
</head>
<body>
  <div>
    <p class="event">2026 인천 AI미래채움 교육페스티벌</p>
    <p class="title">부스 대기 현황</p>
    <p class="lead">지금 바로 체험할 수 있는 부스와<br />대기시간을 확인하세요</p>
    <p class="url">incheon-live.vercel.app</p>
  </div>
  <div class="tiles" aria-hidden="true">
    <div class="tile free"><b>5<small>분</small></b><span>여유</span></div>
    <div class="tile normal"><b>15<small>분</small></b><span>보통</span></div>
    <div class="tile busy"><b>30<small>분</small></b><span>혼잡</span></div>
  </div>
</body>
</html>
