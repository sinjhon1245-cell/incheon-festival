# ===================================================================
# 부스 Live 사이트 (Netlify 의 두 번째 사이트)
#   관람객 화면(index.html) + 부스 운영자 화면(booth-ctrl.html)
#
# 운영 포털과 같은 저장소를 쓰되, Netlify 에서 사이트를 하나 더 만들고
#   Base directory  →  live
# 로 지정합니다. 그러면 Netlify 가 이 파일을 읽어 build.sh 로
# 두 화면과 필요한 파일만 담은 배포본(live/dist)을 만듭니다.
# 운영 포털 · 관리자 화면 · QR 인쇄 화면은 이 사이트에 올라가지 않습니다.
# (QR 인쇄는 관리자 로그인이 필요해 운영 포털에서 합니다.)
#
# 자세한 순서는 README 의 '부스 실시간 대기 현황' 을 보세요.
# ===================================================================

[build]
  command = "sh build.sh"
  publish = "dist"
  # 두 화면의 원본은 대부분 이 폴더 밖(저장소 뿌리)에 있습니다.
  # Base directory 사이트는 이 폴더 안이 바뀌지 않으면 빌드를 건너뛸
  # 수 있어서, 화면을 고쳐도 배포되지 않는 일이 생깁니다.
  # 그래서 배포본에 들어가는 원본을 직접 적어 둡니다. 이 목록 중
  # 하나라도 바뀌면 빌드하고(종료 코드 1), 아무것도 안 바뀌면
  # 건너뜁니다(0). 운영 포털만 고친 push 로 Live 사이트가 다시
  # 배포되지 않게 하는 효과도 있습니다.
  #
  # 앞의 두 [ ] 는 '비교할 앞 배포가 있을 때만 건너뛴다' 는 뜻입니다.
  # 캐시 없이 도는 빌드(사이트를 처음 만들 때 · Clear cache and deploy
  # site · 캐시가 지워졌을 때)에서는 Netlify 가 CACHED_COMMIT_REF 를
  # COMMIT_REF 와 같게 주거나 비워 둡니다. 그대로 git diff 에 넘기면
  # '바뀐 것 없음(0)' 이 나와 빌드가 취소되고, 취소된 빌드는 캐시를
  # 남기지 않아 다음 push 도 또 취소됩니다 — Live 사이트가 영영
  # 올라가지 않습니다. 그래서 그 두 경우에는 언제나 빌드합니다.
  # 앞 커밋을 찾지 못해 git diff 가 오류를 내도(0 이 아니므로) 빌드합니다.
  # 작은따옴표 문자열(TOML literal)이라 안의 큰따옴표가 그대로 넘어갑니다.
  # build.sh 에 복사할 파일을 더하면 여기에도 같이 더하세요.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../visitor.html ../booth-ctrl.html ../assets/config.js ../assets/booth-core.js ../assets/mock-data.js ../assets/visitor.css ../assets/booth-ctrl.css'

# 운영자 화면의 '관람객 화면' 링크는 시연(?demo) 때 같은 사이트의
# visitor.html?demo 로 갑니다(운영 포털에는 그 이름으로 있습니다).
# 이 사이트에서는 관람객 화면이 첫 화면(index.html)이라, 그 이름으로 와도
# 같은 화면을 내줍니다. rewrite(200)라 주소창의 ?demo 가 그대로 남습니다.
[[redirects]]
  from = "/visitor.html"
  to = "/index.html"
  status = 200

# 검색엔진에 올리지 않습니다. 입구 QR · 운영자 카드로 들어오는 사이트라
# 검색으로 찾을 이유가 없고, 행사가 끝난 뒤 낡은 화면이 검색되지 않게 합니다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 배포 즉시 새 화면이 보이도록 코드는 매번 확인합니다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# 부스 운영자 화면. 부스 열쇠는 주소의 # 뒤(#k=…)에 있어서 서버에도,
# 다른 사이트로 가는 Referer 에도 실리지 않습니다. 그래도 화면 안의
# 링크를 눌렀을 때 주소가 따라가지 않도록 no-referrer 를 겁니다.
# 진짜 방어선은 페이지 안의 <meta name="referrer"> 입니다.
# 캐시는 no-store 대신 no-cache 로 둡니다. HTML 에는 열쇠가 없어서
# 저장돼도 새는 것이 없고, no-store 는 뒤로가기 캐시까지 꺼서 현장
# 휴대폰에서 화면을 다시 열 때 느려지기만 합니다.
# /booth-ctrl 은 Netlify 가 .html 없이도 같은 파일을 내주는 주소입니다.
# (운영 포털의 netlify.toml 과 같은 규칙입니다.)
[[headers]]
  for = "/booth-ctrl.html"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/booth-ctrl"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache, must-revalidate"
