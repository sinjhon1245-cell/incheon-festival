# ===================================================================
# Netlify 배포 설정
#
# 빌드 도구가 없는 정적 사이트라 publish 만 지정하면 됩니다.
# GitHub main 브랜치에 push 하면 자동 배포됩니다.
# ===================================================================

[build]
  publish = "."
  command = ""

# 관리자 화면을 /admin 으로도 열 수 있게 합니다.
# rewrite(200) 라 주소창에는 /admin 이 그대로 남습니다.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# 로그인 없이 열리지만 검색엔진에는 올리지 않습니다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 관리자 페이지는 저장해 두지 않습니다.
# no-store 는 브라우저가 이 페이지를 뒤로가기 캐시(bfcache)에
# 넣는 것도 막습니다. 로그아웃한 뒤 뒤로가기를 눌렀을 때 관리
# 화면이 되살아나지 않게 하는 두 번째 방어선입니다.
# (첫 번째는 admin.js 의 pageshow 처리입니다.)
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"

# 부스 운영자 화면. 부스 열쇠는 주소의 # 뒤(#k=…)에 있어서 서버에도,
# 다른 사이트로 가는 Referer 에도 실리지 않습니다. 그래도 화면 안의
# 링크를 눌렀을 때 주소가 따라가지 않도록 no-referrer 를 겁니다.
# 진짜 방어선은 페이지 안의 <meta name="referrer"> 입니다 — 이 헤더는
# GitHub Pages 에서는 붙지 않기 때문입니다.
# 캐시는 no-store 대신 no-cache 로 둡니다. HTML 에는 열쇠가 없어서
# 저장돼도 새는 것이 없고, no-store 는 뒤로가기 캐시까지 꺼서 현장
# 휴대폰에서 화면을 다시 열 때 느려지기만 합니다.
# /booth-ctrl 은 Netlify 가 .html 없이도 같은 파일을 내주는 주소입니다.
[[headers]]
  for = "/booth-ctrl.html"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/booth-ctrl"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache, must-revalidate"

# QR 인쇄 화면은 관리자 로그인으로 모든 부스의 운영자 QR(열쇠)을
# 띄웁니다. 관리자 화면과 같은 이유로 저장하지 않습니다 — 자리를
# 비운 사이 뒤로가기로 QR 이 되살아나지 않게 합니다.
[[headers]]
  for = "/print-qr.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/print-qr"
  [headers.values]
    Cache-Control = "no-store"

# 설정 파일은 캐시하지 않습니다. Supabase 주소나 키를 바꿨을 때
# 예전 값이 남아 "연결 안 됨"으로 보이는 일을 막습니다.
[[headers]]
  for = "/assets/config.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# 코드도 배포마다 새로 받도록 둡니다. 파일이 작아 부담이 없고,
# 배포했는데 옛 화면이 보이는 혼란을 피하는 쪽이 낫습니다.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# 원본 디자인 파일과 SQL 은 배포에 필요 없습니다.
# force = true 가 없으면 Netlify 는 실제 파일을 먼저 내주기 때문에
# 이 규칙이 그냥 무시됩니다. 실제로 두 경로가 열려 있었습니다.
[[redirects]]
  from = "/design/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

# 부스 Live 사이트(따로 배포)의 빌드 설정 폴더. 이 사이트에서 열 이유가 없습니다.
# 운영 포털의 visitor.html · booth-ctrl.html 은 막지 않습니다 — ?demo 미리 보기가
# 이 사이트의 사본을 씁니다(종이 QR 은 부스 Live 사이트로 갑니다).
[[redirects]]
  from = "/live/*"
  to = "/index.html"
  status = 404
  force = true
