# ═══════════════════════════════════════════════════════════════
# GitHub Pages(Jekyll) 배포 설정
#
# 이 저장소는 main 뿌리에서 그대로 배포됩니다. 그래서 개발용
# 파일까지 주소만 알면 열립니다. 아래 목록은 배포본에서 뺍니다.
#
# 보안 목적이 아닙니다. 저장소가 공개라 여기 적힌 파일은
# github.com 에서 누구나 볼 수 있습니다. 비밀은 애초에 저장소에
# 넣지 않습니다(service_role 키는 환경변수로만 씁니다).
# 이건 "운영 사이트에 굳이 있을 이유가 없는 것을 내보내지 않는다"
# 는 정돈입니다.
#
# ⚠️ 여기 넣기 전에 운영 파일이 그 파일을 쓰는지 반드시 확인하세요.
#    index.html · admin.html 은 assets/ 의 css·js 와 서로만 참조하고,
#    이미지는 저장소가 아니라 Supabase Storage 에서 옵니다.
#
# ⚠️ .nojekyll 파일을 만들지 마세요. 그 파일이 있으면 Jekyll 이
#    통째로 꺼져서 이 exclude 가 전부 무시됩니다.
# ═══════════════════════════════════════════════════════════════

exclude:
  # 운영자가 자기 컴퓨터에서 돌리는 스크립트. 사이트는 쓰지 않습니다.
  - scripts

  # Supabase SQL Editor 에 직접 붙여 넣는 마이그레이션.
  - supabase

  # 랜딩 디자인 원본. 운영 화면 어디에서도 참조하지 않습니다.
  - design

  # 개발 기록·안내 문서. 저장소에는 남기고 사이트에서만 뺍니다.
  - TASK.md
  - README.md

  # 로컬 미리보기 서버. 배포본에서는 쓸 일이 없습니다.
  - dev-server.js
  - dev-server.ps1

  # Netlify 설정. GitHub Pages 에서는 읽히지도 않습니다.
  # (저장소에는 남습니다 — 나중에 Netlify 로 돌아갈 수 있습니다.)
  - netlify.toml

# 점(.)으로 시작하는 것들(.gitignore · .claude/ · .mcp.json)은
# Jekyll 이 기본으로 빼기 때문에 여기 적지 않아도 배포되지 않습니다.
# 실제로 확인했습니다 — 지금도 404 입니다.
