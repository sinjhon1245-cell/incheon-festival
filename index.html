<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>행사 운영 포털 · 2026년 인천 AI·SW미래채움 교육페스티벌</title>
<meta name="description" content="2026년 인천 AI·SW미래채움 교육페스티벌 행사 운영 포털입니다. 행사 관계자용 안내 화면입니다." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#FFFFFF" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="assets/portal.css" />
</head>
<body>

<a class="skip-link" href="#main">본문으로 건너뛰기</a>

<!-- ══ 설정 없음 ═══════════════════════════════════════════════ -->
<div class="gate" id="gate-setup" hidden>
  <div class="gate__card">
    <p class="gate__kicker">설정 필요</p>
    <h1 class="gate__title">서버에 연결할 수 없습니다</h1>
    <p class="gate__desc">
      <code>assets/config.js</code> 에 Supabase 주소와 publishable 키가 없습니다.
      <code>README.md</code> 의 “Supabase 설정”을 참고해 입력해 주세요.
    </p>
  </div>
</div>

<!-- ══ 포털 본체 ═══════════════════════════════════════════════
     로그인 화면이 없습니다. 주소를 아는 관계자는 바로 들어옵니다.
     편집은 /admin 에서 관리자만 합니다. ═══════════════════════ -->
<div class="app" id="app" hidden>

  <!-- 데스크톱 사이드바 -->
  <aside class="side" id="side">
    <!-- 로고를 누르면 홈으로. 웹에서 가장 오래된 약속이라,
         링크가 아니면 눌러 보고 아무 일도 안 일어나 당황합니다. -->
    <a class="side__brand" href="#dashboard">
      <span class="side__mark" aria-hidden="true"></span>
      <span>
        <b>행사 운영 포털</b>
        <small>인천 AI·SW미래채움</small>
      </span>
    </a>
    <nav class="side__nav" id="sidenav" aria-label="주요 메뉴"></nav>
    <div class="side__foot">
      <p class="side__who">행사 운영 포털</p>
    </div>
  </aside>

  <div class="main-wrap">
    <!-- 모바일 상단바 -->
    <header class="topbar">
      <span class="topbar__title" id="topbar-title">대시보드</span>
      <span class="topbar__clock" id="topbar-clock"></span>
    </header>

    <main class="main" id="main" tabindex="-1">
      <div id="view"></div>
    </main>
  </div>

  <!-- 모바일 하단 내비 -->
  <nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>
</div>

<!-- ══ 더보기 시트 ═════════════════════════════════════════════ -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close-sheet></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheet-title">더보기</h2>
      <button class="iconbtn" type="button" data-close-sheet aria-label="닫기">✕</button>
    </div>
    <nav class="sheet__nav" id="sheetnav" aria-label="추가 메뉴"></nav>
  </div>
</div>

<!-- ══ 상세 드로어 (부스 · 공지 · 요청) ════════════════════════ -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer__scrim" data-close-drawer></div>
  <div class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer__head">
      <h2 class="drawer__title" id="drawer-title">상세</h2>
      <button class="iconbtn" type="button" data-close-drawer aria-label="닫기">✕</button>
    </div>
    <div class="drawer__body" id="drawer-body"></div>
  </div>
</div>

<!-- ══ 알림 ════════════════════════════════════════════════════ -->
<!-- ══ 이미지 크게 보기 ════════════════════════════════════════
     배치도는 작은 화면에서 확대 없이는 읽기 어렵습니다. ══════ -->
<div class="zoom" id="zoom" hidden>
  <div class="zoom__scrim" data-close-zoom></div>
  <div class="zoom__panel" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
    <button class="zoom__close" type="button" id="zoom-close" data-close-zoom aria-label="닫기">✕</button>
    <div class="zoom__scroll">
      <img id="zoom-img" src="" alt="" />
    </div>
    <p class="zoom__cap" id="zoom-cap" hidden></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/portal.js"></script>
</body>
</html>
