<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>부스 대기 현황</title>
  <meta name="description" content="부스별 대기 시간과 지금 바로 체험할 수 있는 부스를 보여 줍니다." />
  <meta name="theme-color" content="#5B45E0" />
  <meta name="color-scheme" content="light" />
  <meta name="format-detection" content="telephone=no" />
  <!-- 아이콘 파일이 없어 브라우저가 /favicon.ico 를 따로 찾지 않게 빈 아이콘을 둡니다(요청 1건 아끼기). -->
  <link rel="icon" href="data:," />

  <!-- 글꼴 서버에 미리 연결해 둡니다. 행사장 LTE 에서는 새 서버와 처음 인사하는 데만
       수백 ms 가 걸립니다. 대기 현황은 같은 사이트(/api/live-snapshot)에서 받으므로
       데이터 서버(Supabase)에는 연결하지 않습니다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- 글꼴은 화면을 막지 않고 받습니다. 받기 전에는 기기 글꼴로 먼저 그립니다. -->
  <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" /></noscript>
  <link rel="stylesheet" href="assets/visitor.css" />
</head>
<body>
  <!-- 관람객 전용 화면입니다. 운영 화면으로 가는 링크나 주소를 이 파일에 두지 않습니다.
       배포 스크립트가 그런 흔적을 찾으면 배포를 멈춥니다. -->

  <!-- 협의용 예시 화면(주소에 ?demo=1)일 때만 보이는 띠. 스크롤해도 맨 위에 붙어 있어
       예시 부스를 실제 운영 정보로 읽지 않게 합니다. -->
  <div class="demobar" id="demobar" role="note" hidden>
    <div class="col demobar__in">
      <p class="demobar__t"><span class="demotag">협의용 예시</span><span class="sr-only"> · </span><span class="demobar__w">실제 행사 정보가 아닙니다.</span></p>
    </div>
  </div>

  <header class="band">
    <div class="col band__in">
      <div class="band__row">
        <h1 class="band__title">부스 대기 현황</h1>
        <p class="sync" id="sync" hidden><i class="sync__sq" aria-hidden="true"></i><span id="sync-text"></span></p>
        <button type="button" class="sync-btn" id="refresh" hidden>새로고침</button>
      </div>
      <p class="band__event" id="band-event"></p>
    </div>
  </header>

  <div class="strip" id="strip" role="status" hidden>
    <div class="col strip__in">
      <p class="strip__t"><i class="sq" aria-hidden="true"></i><span id="strip-text"></span></p>
      <button type="button" class="strip__btn" id="retry">다시 불러오기</button>
    </div>
  </div>

  <main id="main">
    <div class="col">
      <section class="demoinfo" id="demoinfo" aria-labelledby="demoinfo-t" hidden>
        <p class="demoinfo__t" id="demoinfo-t">실제 부스가 등록되면 이런 모습이 돼요</p>
        <p class="demoinfo__d">아래 부스 · 구역 · 대기 시간은 화면을 협의하려고 이 브라우저 안에서만 만든 예시예요. 서버에 저장하지 않고 실제 부스 정보와 섞지 않아요. 검색 · 구역 · 상태 · 정렬 · 한눈에 보기는 실제 화면과 똑같이 움직여요.</p>
        <button type="button" class="line-btn demoinfo__btn" data-act="demo-exit">실제 화면으로 돌아가기</button>
      </section>
      <div id="here" hidden></div>
      <section class="hero" id="hero" aria-label="지금 상황 요약"></section>
      <!-- 부스가 많을 때(SEARCH_FIELD_MIN 곳 이상) 검색을 아이콘에만 두지 않고 검색칸 모양으로도 보여 줍니다.
           누르면 붙박이 줄의 검색칸이 열립니다(붙박이 줄 높이는 그대로). -->
      <button type="button" class="qopen" id="search-field" data-act="search-open" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 20.5 20.5" /></svg>
        <span>부스 이름 · 번호 · 체험 내용으로 찾기</span>
      </button>
    </div>

    <div class="bar" id="bar" hidden>
      <div class="col bar__in">
        <div class="bar__tabs" id="bar-tabs">
          <div class="tabs" id="tabs" role="group" aria-label="구역"></div>
          <button type="button" class="bar__icon" id="search-open" aria-label="부스 검색">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 20.5 20.5" /></svg>
          </button>
        </div>
        <form class="bar__search" id="search" role="search" hidden>
          <label class="sr-only" for="q">부스 검색</label>
          <input type="search" id="q" placeholder="부스 이름 · 번호 · 체험 내용" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
          <button type="button" class="bar__cancel" id="search-cancel">취소</button>
        </form>
      </div>
      <!-- 구역이 많을 때의 '구역 선택' 패널(renderPick). 붙박이 줄 바로 아래에 펼쳐집니다. -->
      <div class="zpick" id="zone-panel" role="group" aria-label="구역 선택" hidden></div>
    </div>

    <div class="col">
      <div class="controls" id="controls" hidden>
        <div class="seg" role="group" aria-label="보기 방식">
          <button type="button" data-view="list" aria-pressed="true">목록</button>
          <button type="button" data-view="grid" aria-pressed="false">한눈에</button>
        </div>
        <div class="seg" id="sort-seg" role="group" aria-label="정렬">
          <button type="button" data-sort="code" aria-pressed="true">번호순</button>
          <button type="button" data-sort="wait" aria-pressed="false">대기 짧은 순</button>
        </div>
      </div>
      <p class="result" id="result" hidden></p>
      <!-- 목록 전체를 aria-live 로 두지 않습니다. 새로 받을 때마다 화면 읽기
           프로그램이 부스 수십 개를 처음부터 다시 읽게 됩니다. 바뀐 요약만
           아래 sr-summary 가 알립니다. -->
      <div id="list"></div>
      <!-- 목록 끝까지 내려온 뒤에도 위로 올라가지 않고 나갈 수 있게 한 번 더 둡니다(예시 화면에서만). -->
      <div class="demoexit" id="demoexit" hidden>
        <button type="button" class="line-btn" data-act="demo-exit">실제 화면으로 돌아가기</button>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="col foot__in">
      <p id="foot-text">대기 시간은 각 부스 운영자가 현장에서 직접 입력해요. 실제 현장 상황과 조금 다를 수 있어요.</p>
    </div>
  </footer>

  <div class="sheet" id="sheet" role="region" aria-labelledby="sheet-name" hidden>
    <div class="sheet__top">
      <span class="sheet__code" id="sheet-code"></span>
      <button type="button" class="sheet__close" id="sheet-close">닫기</button>
    </div>
    <div id="sheet-body"></div>
  </div>

  <p class="sr-only" id="sr-summary" aria-live="polite"></p>

  <noscript>
    <div class="col"><p class="empty__d">이 화면은 자바스크립트를 켜야 볼 수 있어요.</p></div>
  </noscript>

  <script src="assets/config.js"></script>
  <script src="assets/mock-data.js"></script>
  <script src="assets/booth-core.js"></script>

  <script>
  /* ===================================================================
     관람객 화면 그리기

     데이터는 모두 BoothCore.getLiveSnapshot()(assets/booth-core.js)이 같은
     사이트의 /api/live-snapshot 하나에서 가져옵니다. 이 화면은 Supabase 를
     부르지 않고, 받은 것을 그리기만 합니다.

       처음 열 때   지난번에 받아 둔 결과(snapshot)가 있으면 그것부터 바로
                    그리고, 없으면 빈 줄 여섯 개를 둡니다. 그다음 스냅샷을 받습니다.
       그 뒤        20초 ±4초마다 스냅샷 하나를 다시 받습니다. 받는 중이면 겹쳐
                    보내지 않습니다. 화면이 가려지면 멈추고, 다시 보이면 바로 받습니다.
       실패하면     마지막으로 받은 것을 그대로 두고 40초 → 80초 → 120초로 늦춰 가며
                    같은 주소를 다시 받습니다(Supabase 로 돌아가지 않음). 성공하면 20초로.

     관람객에게는 입력 시각 · 'N분 전' · 오래됨(흐린 숫자 · '확인 필요')을 보여 주지
     않습니다. 지금 상태만 말합니다. 오래된 값 관리는 부스 운영자 화면과 관리
     화면의 몫입니다. 스냅샷을 오래 새로 받지 못했을 때만 '현황 연결이 잠시
     지연되고 있습니다.' 한 줄을 띄웁니다.

     새로 받을 때 목록을 통째로 다시 만들지 않습니다. 이미 있는 줄의 숫자와
     글자만 바꿉니다. 펼쳐 둔 줄이 접히거나, 누르려던 단추가 손가락 밑에서
     사라지면 안 되기 때문입니다. 보이는 부스나 순서가 달라질 때만(구역 ·
     상태 · 정렬 · 검색 · 보기 방식을 바꿨을 때 등) 다시 만들고, 그때도
     펼친 줄과 초점은 되살립니다.

     큰 숫자 · 막대 · 상태별 숫자 · 거르기는 모두 bucketOf() 하나로
     셉니다. "보통 4" 를 눌렀는데 목록이 5곳이면 이 화면을 믿지 않게 됩니다.
     =================================================================== */
  (function () {
    'use strict';

    var core = window.BoothCore;
    if (!core) return;

    var cfg = core.cfg || {};
    var esc = core.esc;
    var pad2 = core.pad2;

    /* 받는 간격. 관람객 요청 하나하나가 Vercel 요청 1건(캐시에서 나가도 1건)이라 무료 한도를 아끼려고
       느리게 둡니다(scripts/loadtest/README.md 'Hobby'). 서버가 스냅샷에 실어 보내는 mode 로 바뀝니다
       (live/api/live-snapshot.mjs — Vercel 환경 변수 VISITOR_TRAFFIC_MODE).
         normal    POLL_MS(설정 pollingIntervalMs, 기본 60초) ± 1/6 — 60초면 50~70초
         conserve  POLL_MS × 2 ± 1/6 — 100~140초
         manual    자동으로 받지 않음. 처음 열 때 · 화면에 돌아올 때 · '새로고침' 단추로만
       행사 날의 여는 시각 30분 전 ~ 닫는 시각 30분 뒤(설정의 event_start · event_end, 한국 시각)
       밖에서는 mode 와 관계없이 자동으로 받지 않습니다(처음 열 때 · 돌아올 때만).
       15초 아래로는 내리지 않고(live/build.sh 도 같은 하한), 2분 위로는 올리지 않습니다 — 아주 큰 값은
       setTimeout 이 32비트를 넘겨 곧바로 실행되어 쉬지 않고 받게 됩니다. */
    var POLL_MS = Math.min(2 * 60 * 1000, Math.max(15000, Number(cfg.pollingIntervalMs) || 60000));
    var MODES = { normal: 1, conserve: 2, manual: 0 };   // POLL_MS 의 몇 배(0 = 자동으로 받지 않음)
    var WINDOW_PAD_MIN = 30;         // 행사 시간 앞뒤로 자동으로 받는 여유(분)
    // 실패가 이어질 때: 90초 → 120초 → 180초(±15%). 지금 간격보다 짧으면 지금 간격을 씁니다 —
    // 장애 때 정상일 때보다 자주 받지 않습니다. manual · 행사 시간 밖에서는 다시 시도하지 않습니다.
    var BACKOFF_MS = [90 * 1000, 120 * 1000, 180 * 1000];
    // 다시 보임 · 인터넷 복귀로 바로 받을 때, 이보다 가까운 시도 뒤면 받지 않음. 앱을 자주 오가는 관람객이
    // 간격보다 자주 받지 않게 합니다. CDN 사본도 10~40초 단위로 바뀌어 그 안의 다시 받기는 새 것이 거의 없습니다.
    var MIN_GAP_MS = 30000;
    var MANUAL_GAP_MS = 5000;        // '새로고침' 단추를 연달아 눌러도 이 간격 안에서는 한 번만
    var WAKE_GRACE_MS = 8000;        // 화면이 다시 켜진 직후에는 새로 받는 중이라 늦었다고 하지 않습니다
    var TICK_MS = 15000;             // 운영 시간 · 연결 지연을 다시 따지는 간격

    var COUNT_KEYS = ['여유', '보통', '혼잡', 'off'];
    var COUNT_CLS = { '여유': 'free', '보통': 'normal', '혼잡': 'busy', 'off': 'off', 'unknown': 'unknown' };
    var COUNT_WORD = { '여유': '여유', '보통': '보통', '혼잡': '혼잡', 'off': '중단·마감' };

    var reduceMotion = false;
    try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduceMotion = false; }

    function $(id) { return document.getElementById(id); }
    function each(list, fn) { Array.prototype.forEach.call(list, fn); }

    var S = {
      settings: {},
      zones: [],
      raw: [],          // BoothCore 가 정리해 준 부스(운영 시간 규칙 적용 전)
      booths: [],       // 화면에 쓰는 부스(운영 시간 규칙 적용 후)
      byId: {},
      liveReady: null,
      info: null,       // BoothCore.eventInfo()
      hasData: false,   // 그릴 것이 있는가(지난번 결과 포함)
      fresh: false,     // 이번에 연 뒤 서버에서 한 번이라도 받았는가
      openedAt: Date.now(),
      genAt: null,      // 마지막으로 받은 스냅샷의 generatedAt(서버 시각 · 화면에 보이지 않음)
      movedAt: 0,       // generatedAt 이 바뀐 스냅샷을 받은 때(이 기기 시각). 연결 지연 판단에만 씁니다
      failed: false,
      navOffline: false,
      visibleSince: Date.now(),
      ui: { zone: '', count: '', sort: 'code', view: 'list', q: '', search: false },
      open: {},         // 펼친 줄
      lastRow: null,    // 마지막으로 펼친 줄(뒤로 가기 기록의 '연 상세')
      sel: null,        // 한눈에 보기에서 고른 타일
      mapOpen: false,
      prevSig: null,    // 바뀐 줄을 찾으려고 기억해 둔 값
      changed: {},
      keys: { hero: '', tabs: '', list: '', here: '', sheet: '', sum: '', band: '', strip: '', pick: '' },
      zpick: false,     // '구역 선택' 패널이 열려 있는가
      hereParam: null,
      hereGone: false,
      mode: 'normal',   // 서버가 스냅샷에 실어 보내는 받기 방식(normal · conserve · manual). 화면에 이름을 보이지 않습니다
      preview: false    // 행사 전이지만 예시 부스('[예시]' 기관) 값을 미리 보여 주는 중 — 화면에 따로 알리지는 않습니다
    };

    /* ── 작은 도우미 ─────────────────────────────────────────── */
    function domId(id) { return String(id).replace(/[^A-Za-z0-9_-]/g, '_'); }
    function findById(root, selector, id) {
      var els = root.querySelectorAll(selector);
      for (var i = 0; i < els.length; i++) if (els[i].getAttribute('data-id') === id) return els[i];
      return null;
    }
    // 검색 · 부스 번호 비교용: 한글 자모 조합을 맞추고(NFC), 대소문자와 띄어쓰기를 무시합니다.
    function norm(s) {
      var t = String(s === null || s === undefined ? '' : s);
      if (typeof t.normalize === 'function') t = t.normalize('NFC');
      return t.toLowerCase().replace(/\s+/g, '');
    }
    function clearLive(b) {
      var c = {};
      for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) c[k] = b[k];
      c.congestion = null; c.wait_minutes = null; c.congestion_updated_at = null;
      return c;
    }
    function smooth() { return reduceMotion ? 'auto' : 'smooth'; }

    // 운영 시간 중이고 기능이 켜져 있을 때만 대기 시간을 보여 줍니다.
    // 행사 전이라도 예시 부스가 있으면 그 부스들의 값은 미리 보여 줍니다(S.preview).
    function liveOn() {
      return !!S.info && (S.info.phase === 'open' || S.preview) && S.liveReady !== false;
    }
    function effView() { return liveOn() ? S.ui.view : 'list'; }
    function effSort() { return liveOn() ? S.ui.sort : 'code'; }

    /* ── 받은 것을 화면용으로 ─────────────────────────────────── */
    function derive() {
      S.info = core.eventInfo(S.settings, Date.now());
      var list = S.raw || [];
      // 행사 전에는 스냅샷이 예시 부스의 값만 담아 옵니다(live/api/live-snapshot.mjs 가 '[예시]' 로
      // 가려 냄 — 그 표시는 관람객에게 보내지 않습니다). 그래서 값이 있는 부스가 곧 미리 보기 부스입니다.
      S.preview = S.info.phase === 'before' && list.some(function (b) { return !!b.congestion; });
      if (S.info.phase === 'open') {
        // 오늘 문 열기 전에 넣은 값(리허설 · 아침 준비)은 '지금 대기' 가 아닙니다.
        list = core.applyOpenRule(list, S.info);
      } else if (S.info.phase !== 'before') {
        // 운영 시간 밖에는 남아 있는 값을 쓰지 않습니다. 숫자 · 정렬 · 거르기가
        // 모두 '정보 없음' 으로 같게 움직이도록 아예 비웁니다.
        list = list.map(clearLive);
      }
      S.booths = list;
      S.byId = {};
      list.forEach(function (b) { S.byId[b.id] = b; });
    }

    // 화면의 숫자 · 막대 · 거르기가 모두 쓰는 칸. BoothCore.bucket() 과 같되 '오래됨' 을 따지지 않습니다
    // (입력이 오래됐다고 관람객 화면에서 '정보 없음' 으로 돌리지 않음 — 그 관리는 운영자 · 관리 화면이 합니다).
    function bucketOf(b) {
      var c = b && b.congestion;
      if (c === '여유' || c === '보통' || c === '혼잡') return c;
      if (c === '중단' || c === '마감') return 'off';
      return 'unknown';
    }

    function counts() {
      var c = { '여유': 0, '보통': 0, '혼잡': 0, 'off': 0, 'unknown': 0 };
      S.booths.forEach(function (b) { c[bucketOf(b)]++; });
      return c;
    }

    // 실제로 부스가 있는 구역만, zones 순서대로. zones 에 없는 구역은 뒤에 붙입니다.
    function zoneList() {
      var out = [], seen = {}, n = {};
      S.booths.forEach(function (b) { n[b.zone_key] = (n[b.zone_key] || 0) + 1; });
      S.zones.forEach(function (z) {
        if (n[z.key] && !seen[z.key]) { seen[z.key] = true; out.push({ key: z.key, label: z.label || (z.key + '구역'), n: n[z.key] }); }
      });
      S.booths.forEach(function (b) {
        if (!seen[b.zone_key]) { seen[b.zone_key] = true; out.push({ key: b.zone_key, label: b.zone_name || '기타', n: n[b.zone_key] }); }
      });
      return out;
    }

    function searching() { return !!searchTest(); }

    // 화면 · 검색에 쓰는 기관 이름: '[예시]' 표시는 떼어 냅니다. 스냅샷은 이미 뗀 이름을 주지만,
    // 이 기기에 남아 있던 예전 값에도 표시가 보이지 않게 한 번 더 거릅니다.
    function orgText(b) { return core.displayOrganization(b.org); }
    function hay(b) {
      return norm([b.code, String(b.code || '').replace(/-/g, ''), looseCode(b), looseCode(b, '-'), b.name, orgText(b), b.program, b.zone_name].join(' '));
    }
    // 앞의 0 을 뺀 부스 번호: 'B-03' → 'b3'(sep 이 '-' 이면 'b-3'). 'b3' · 'B-3' 으로 쳐도 B-03 이 찾아집니다.
    function looseCode(b, sep) {
      var m = /^([a-z]+)-?0*(\d+)$/i.exec(String(b.code || ''));
      return m ? norm(m[1] + (sep || '') + m[2]) : '';
    }

    // 한글 낱자모: 조합형(0x1100-0x11FF)과 호환형 'ㄱ'-'ㆎ'(0x3131-0x318E)
    // 천지인 자판은 모음을 만드는 도중 'ㆍ' 대신 '·'(0x00B7) · '‥'(0x2025)를 보여 주기도 해서 함께 뺍니다.
    function isJamo(c) { return (c >= 0x1100 && c <= 0x11FF) || (c >= 0x3131 && c <= 0x318E) || c === 0x00B7 || c === 0x2025; }

    // 치는 도중의 가운뎃소리(모음)가 곧 바뀔 수 있는 모음들. 번호는 유니코드 한글 순서
    // (ㅏ0 ㅐ1 ㅑ2 ㅒ3 ㅓ4 ㅔ5 ㅕ6 ㅖ7 ㅗ8 ㅘ9 ㅙ10 ㅚ11 ㅛ12 ㅜ13 ㅝ14 ㅞ15 ㅟ16 ㅠ17 ㅡ18 ㅢ19 ㅣ20).
    //   두벌식     겹모음을 두 번 쳐서 '화' 앞에 '호', '퀴' 앞에 '쿠', '의' 앞에 '으' 가 들어옵니다.
    //   천지인     ㅣ · ㆍ · ㅡ 를 쌓아 '기' → '가' → '개', '그' → '구' → '규' → '궈', '고' → '괴' → '과'.
    //   나랏글 등  획을 더해 'ㅓ' → 'ㅕ', 'ㅗ' → 'ㅛ'.
    // 여기 없는 모음(ㅐ ㅔ ㅙ ㅞ ㅟ ㅢ 등)은 더 바뀌지 않으니 그 모음만 봅니다.
    // 아무 모음이나 맞게 두면 다 친 '외' 가 'ㅇ' 으로 시작하는 부스를 모두 '검색 결과' 로 보여 줍니다.
    var VOWEL_NEXT = {
      20: [20, 0, 1, 2, 3], 0: [0, 1, 2, 3], 2: [2, 3],
      4: [4, 5, 6, 7], 6: [6, 7],
      8: [8, 9, 10, 11, 12], 11: [11, 9, 10], 9: [9, 10],
      13: [13, 14, 15, 16, 17], 17: [17, 14, 15], 14: [14, 15],
      18: [18, 19, 13, 14, 15, 16, 17]
    };

    // 검색어를 '이 부스가 맞는가' 를 묻는 함수로 바꿉니다(검색어가 없으면 null).
    // 한글은 치는 도중에도 글자마다 input 이 옵니다. '로봇' 은 ㄹ → 로 → 롭 → 로보 → 로봇
    // 으로 들어오는데, 'ㄹ' · '롭' · '로보' 는 어느 부스 이름에도 없어서 그대로 찾으면
    // 글자마다 '찾는 부스가 없어요' 가 깜빡이고 목록 높이가 줄었다 늘며 화면이 튑니다.
    // 조합 이벤트(isComposing)는 iOS 한글 자판에서 믿을 수 없으니 글자 모양만 봅니다.
    var qMemo = { q: null, list: null, test: null };
    function searchTest() {
      if (qMemo.q === S.ui.q && qMemo.list === S.booths) return qMemo.test;
      // 끝에 붙은 낱자모('ㄹ', '로봇ㅊ' 의 'ㅊ')는 아직 치는 중인 글자라 뺍니다.
      var q = norm(S.ui.q), e = q.length;
      while (e > 0 && isJamo(q.charCodeAt(e - 1))) e--;
      q = q.slice(0, e);
      var test = null;
      if (q) {
        var exact = function (h) { return h.indexOf(q) >= 0; };
        var anyHit = function (t) { return S.booths.some(function (b) { return t(hay(b)); }); };
        test = exact;
        var c = q.charCodeAt(q.length - 1);
        if (c >= 0xAC00 && c <= 0xD7A3) {
          // 끝 글자를 첫소리(L) · 가운뎃소리(V) · 받침(T) 번호로 나눕니다.
          var s = c - 0xAC00, L = Math.floor(s / 588), V = Math.floor(s / 28) % 21, T = s % 28;
          var head = q.slice(0, -1);
          // 앞부분(head) 바로 뒤에 ok() 를 만족하는 한글 글자가 오는 곳이 있는가
          var after = function (h, ok) {
            for (var i = h.indexOf(head); i >= 0 && i + head.length < h.length; i = h.indexOf(head, i + 1)) {
              var d = h.charCodeAt(i + head.length) - 0xAC00;
              if (d >= 0 && d <= 11171 && ok(Math.floor(d / 588), Math.floor(d / 28) % 21)) return true;
            }
            return false;
          };
          // 받침 없는 끝 글자는 아직 모음이 바뀔 수 있으니('호' → '화', '쿠' → '퀴', '으' → '의')
          // 될 수 있는 모음까지(VOWEL_NEXT), 받침 있는 끝 글자는 같은 모음만 봅니다. 받침은 어느 것이든 맞습니다.
          var vs = T ? [V] : (VOWEL_NEXT[V] || [V]);
          var loose = function (h) { return after(h, function (l, v) { return l === L && vs.indexOf(v) >= 0; }); };
          // 받침 없는 끝 글자('로보' 의 '보')는 곧 받침이 붙을 수 있으니 늘 앞부분으로 찾습니다.
          if (!T) test = loose;
          // 받침 있는 끝 글자('롭')는 그대로 먼저 찾고, 하나도 없을 때만 받침이 다음 글자로
          // 넘어가는 중이라고 보고 받침을 떼고 찾습니다('롭' → '로').
          else if (!anyHit(exact)) test = loose;
        }
      }
      qMemo = { q: S.ui.q, list: S.booths, test: test };
      return test;
    }

    function waitRank(b) {
      var k = bucketOf(b);
      if (k === '여유' || k === '보통' || k === '혼잡') return 0;     // 대기 시간이 있음
      if (b.congestion === '중단') return 1;
      if (!b.congestion) return 2;
      return 3;                                                         // 오늘 마감
    }

    // 붙박이 줄이 검색칸으로 바뀌어 구역 탭이 숨어 있는가(renderBar 의 searchMode 와 같은 조건).
    // 검색어가 비었거나 낱자모뿐이어도(searchTest() 가 null) 검색칸이 열려 있으면 참입니다.
    function searchOpen() { return !!(S.ui.search || S.ui.q); }

    function visible() {
      var u = S.ui, q = searchTest();
      var list = S.booths.filter(function (b) {
        // 검색은 구역을 가리지 않습니다. 검색칸이 열리면 구역 탭이 보이지 않아
        // 어느 구역에 묶여 있는지 알 수 없기 때문입니다. 검색어가 비었거나 'ㄹ' 처럼
        // 낱자모뿐일 때도 같아야 합니다. 그렇지 않으면 'ㄹ' → '로' → 'ㄹ' 로 칠 때마다
        // 목록이 고른 구역 하나와 전체 구역 사이를 오갑니다. 검색칸을 닫으면 고른 구역으로 돌아갑니다.
        if (!searchOpen() && u.zone && b.zone_key !== u.zone) return false;
        // 상태 고름과 검색은 함께 걸리지 않습니다(bind() 의 숫자 단추 · 검색칸 처리 참고).
        if (u.count && bucketOf(b) !== u.count) return false;
        if (q && !q(hay(b))) return false;
        return true;
      });
      var byWait = effView() === 'list' && effSort() === 'wait';
      if (q) {
        // 검색 중에는 맞은 자리 순서가 먼저입니다(searchRank). 같은 순위 안에서는 지금 정렬을 따릅니다.
        var rank = {};
        list.forEach(function (b) { rank[b.id] = searchRank(b, q); });
        list = list.slice().sort(function (a, b) {
          return (rank[a.id] - rank[b.id]) || (byWait ? waitCmp(a, b) : core.compareCode(a.code, b.code));
        });
      } else if (byWait) {
        list = list.slice().sort(waitCmp);
      }
      return list;
    }
    function waitCmp(a, b) {
      return (waitRank(a) - waitRank(b)) ||
        ((a.wait_minutes || 0) - (b.wait_minutes || 0)) ||
        core.compareCode(a.code, b.code);
    }
    // 검색 결과 순위: 부스 번호가 꼭 맞음(B-12 · b12 · b3 · 숫자만 12) → 번호 일부 → 부스 이름 → 체험 내용 → 운영기관 → 구역 이름.
    // 구역 이름에만 걸린 부스(그 구역 전부)가 이름 · 체험 내용이 맞는 부스를 덮지 않게 맨 뒤로 보냅니다.
    // 어느 칸이 맞는지는 검색과 같은 함수(q — 한글 부분 입력까지 맞춤)로 칸마다 다시 봅니다.
    function searchRank(b, q) {
      var code = norm(b.code), bare = code.replace(/-/g, ''), loose = looseCode(b);
      var want = norm(S.ui.q).replace(/-/g, '');
      if (want && (bare === want || loose === want.replace(/^([a-z]+)0+(?=\d)/, '$1'))) return 0;
      if (/^\d{1,3}$/.test(want) && loose && loose.replace(/^[a-z]+/, '') === String(+want)) return 0;
      if (q(code + ' ' + bare + ' ' + loose + ' ' + looseCode(b, '-'))) return 1;
      if (q(norm(b.name))) return 2;
      if (q(norm(b.program))) return 3;
      if (q(norm(orgText(b)))) return 4;
      return 5;
    }

    // 검색칸이 열려 있으면 검색어가 비었거나 낱자모뿐이어도 묶지 않습니다. 치는 동안
    // 묶음 ↔ 한 줄 목록이 글자마다 바뀌며 화면이 튀지 않게 visible() 과 같은 조건을 씁니다.
    function isGrouped() {
      return effSort() === 'code' && !searching() && !searchOpen() && !S.ui.count && zoneList().length >= 2;
    }

    function zoneGroups(items) {
      var zs = zoneList(), by = {};
      items.forEach(function (b) { (by[b.zone_key] = by[b.zone_key] || []).push(b); });
      return zs.filter(function (z) { return by[z.key]; }).map(function (z) {
        return { key: z.key, label: z.label, items: by[z.key] };
      });
    }

    /* ── 상태 글자 ───────────────────────────────────────────── */
    // 관람객에게는 마지막 입력 시각('방금' · 'N분 전' · 'HH:MM에 입력')도, 오래됨(흐린 숫자 ·
    // '확인 필요')도 보여 주지 않고 지금 상태만 말합니다. 아직 입력이 없을 때만 한 줄을 둡니다.
    function ageLine(b) {
      if (!liveOn() || b.congestion) return '';
      return '아직 대기 시간이 입력되지 않았어요';
    }

    function waitNum(b) { return Number(b.wait_minutes) || 0; }
    function isNow(b) { return b.congestion === '여유' && waitNum(b) === 0; }

    // 화면 읽기 프로그램용 한 줄
    function statusSpeech(b) {
      if (!liveOn()) return '';
      if (!b.congestion) return '정보 없음';
      if (b.congestion === '마감') return '오늘 마감';
      return b.congestion === '중단' ? '잠시 중단' : (isNow(b) ? '바로 체험 가능' : '대기 ' + waitNum(b) + '분, ' + b.congestion);
    }

    // 목록 줄 오른쪽: 위는 숫자(또는 낱말), 아래는 네모 + 상태
    function rightHtml(b) {
      if (!liveOn()) return '';
      var c = b.congestion;
      if (!c) return '<span class="st st--unknown">정보 없음</span>';
      if (c === '마감') return '<span class="v v--word">마감</span>';
      if (c === '중단') return '<span class="st st--pause"><i class="sq sq--hollow" aria-hidden="true"></i>잠시 중단</span>';
      var m = core.meta(c);
      var val = isNow(b)
        ? '<span class="v v--now">바로</span>'
        : '<span class="v"><b class="v__n">' + waitNum(b) + '</b><span class="v__u">분</span></span>';
      return val + '<span class="st st--' + m.key + '"><i class="sq" aria-hidden="true"></i>' + esc(m.label) + '</span>';
    }

    // 큰 값(지금 계신 부스 · 한눈에 상세)
    function bigHtml(b) {
      if (!liveOn()) return '';
      var c = b.congestion;
      if (!c) return '<span class="bigv bigv--none">정보 없음</span>';
      if (c === '마감') return '<span class="bigv bigv--word">마감</span>';
      if (c === '중단') return '<span class="bigv bigv--word">잠시 중단</span>';
      var m = core.meta(c);
      var val = isNow(b)
        ? '<span class="bigv bigv--now">바로</span>'
        : '<span class="bigv is-' + m.key + '"><b class="bigv__n">' + waitNum(b) + '</b><span class="bigv__u">분</span></span>';
      return val + '<span class="st st--' + m.key + '"><i class="sq" aria-hidden="true"></i>' + esc(m.label) + '</span>';
    }

    function rowCls(b) {
      return liveOn() ? 'row is-' + core.meta(b.congestion).key : 'row';
    }

    // 줄 앞의 부스 번호는 늘 전체 번호(A-07)입니다. 구역 제목이 화면 위로 지나간 뒤에도
    // 07 이 A-07 인지 B-07 인지 바로 알 수 있게 합니다(부스가 수십 곳일 때).
    function codeLabel(b) {
      if (b.code) return b.code;
      if (b.zone_key && b.no !== null && b.no !== undefined && b.no !== '') return b.zone_key + '-' + pad2(b.no);
      return '';
    }

    /* ── 받는 때 ───────────────────────────────────────────────── */
    // 자동으로 받는 시간대인가: 행사 날(한국 날짜) 여는 시각 30분 전 ~ 닫는 시각 30분 뒤.
    // 아니면 다음에 시작하는 때(ms)를 알려 줍니다. 시간표가 비었거나 시연이면 늘 받습니다.
    function liveWindow(now) {
      var s = S.settings || {};
      var a = core.kstParts(s.event_start), e = core.kstParts(s.event_end);
      if (core.isMock || !a || !e) return { on: true, next: null };
      var t = core.kstParts(now);
      var open = a.min - WINDOW_PAD_MIN;
      var close = (e.min > a.min ? e.min : 24 * 60) + WINDOW_PAD_MIN;
      if (t.dayNum >= a.dayNum && t.dayNum <= e.dayNum && t.min >= open && t.min < close) return { on: true, next: null };
      var day = t.dayNum < a.dayNum ? a.dayNum : (t.min < open ? t.dayNum : t.dayNum + 1);
      if (day > e.dayNum) return { on: false, next: null };
      return { on: false, next: day * 86400000 - 9 * 3600000 + open * 60000 };
    }
    // 지금 자동으로 받는 간격의 배수(0 = 자동으로 받지 않음).
    function autoFactor(now) {
      if (!liveWindow(now).on) return 0;
      return Object.prototype.hasOwnProperty.call(MODES, S.mode) ? MODES[S.mode] : 1;
    }

    /* ── 1 · 2 · 3. 띠 ─────────────────────────────────────────── */
    // 스냅샷 연결이 늦어지고 있는가. 부스 하나가 오래 입력이 없는 것과는 다른 이야기입니다(그것은
    // 운영자 · 관리 화면이 다룹니다). 시각은 화면에 보여 주지 않고 이 판단에만 씁니다.
    //   자동으로 받는 동안   서버가 새로 만든 스냅샷(generatedAt 이 바뀐 것)을 간격 × 2.5(최소 180초)
    //                        넘게 못 받았을 때. 한 번 실패 → 늦춘 다시 받기에서 회복하면 넘지 않습니다
    //                        (60초: 70 + 90×1.15 < 180). CDN 이 낡은 사본만 계속 줄 때도 걸립니다.
    //   자동으로 받지 않는 동안(manual · 행사 시간 밖)  마지막으로 받으려다 실패했을 때만.
    function isLagging() {
      if (S.navOffline) return true;
      var now = Date.now();
      if (now - S.visibleSince <= WAKE_GRACE_MS) return false;
      var f = autoFactor(now);
      if (!f) return S.failed;
      return now - (S.movedAt || S.openedAt) > Math.max(180 * 1000, POLL_MS * f * 2.5);
    }

    function renderBand() {
      var s = S.settings || {};
      var line = [s.event_title, s.venue].filter(Boolean).join(' · ');
      var lag = isLagging(), bad = false, text = '', show = true;
      var auto = autoFactor(Date.now()) > 0;
      // '새로고침' 단추는 운영본부가 자동 갱신을 멈춘 때(manual)에만 둡니다. 관람객에게 까닭은 말하지 않습니다.
      var manualBtn = S.mode === 'manual' && S.hasData && liveWindow(Date.now()).on;
      if (S.info && S.info.phase === 'after') show = false;
      else if (!S.hasData) { text = S.failed ? '연결 안 됨' : '불러오는 중'; bad = S.failed; }
      else if (lag) { text = '연결 지연'; bad = true; }
      else if (!S.fresh) text = '불러오는 중';
      else if (auto) text = '자동 갱신';
      else show = false; // 자동으로 받지 않는 동안에는 '자동 갱신' 이라고 하지 않습니다
      var key = [line, show, text, bad, manualBtn].join('|');
      if (key === S.keys.band) return;
      S.keys.band = key;
      $('band-event').textContent = line;
      $('sync').hidden = !show;
      $('sync').className = 'sync' + (bad ? ' is-lag' : '');
      $('sync-text').textContent = text;
      $('refresh').hidden = !manualBtn;
      if (s.event_title) document.title = '부스 대기 현황 · ' + s.event_title;
    }

    function renderStrip() {
      // 보여 줄 것이 있을 때만 띠를 씁니다. 아무것도 없으면 목록 자리(failHtml)가 안내합니다.
      var text = S.hasData && isLagging() ? '현황 연결이 잠시 지연되고 있습니다.' : '';
      if (text === S.keys.strip) return;
      S.keys.strip = text;
      $('strip').hidden = !text;
      $('strip-text').textContent = text;
    }

    /* ── 4. 지금 계신 부스 (?b=) ──────────────────────────────── */
    // 부스 앞 안내 QR 은 부스 id(UUID)를 담습니다. 손으로 친 주소도 받도록
    // id 앞부분(8자 이상, 하나로만 맞을 때)과 부스 번호도 차례로 찾아봅니다.
    function resolveHere(param) {
      var list = S.booths, n = norm(param), i;
      if (!n) return null;
      for (i = 0; i < list.length; i++) if (String(list[i].id).toLowerCase() === n) return list[i];
      var hex = n.replace(/-/g, '');
      if (/^[0-9a-f]{8,}$/.test(hex)) {
        var hit = list.filter(function (b) { return String(b.id).toLowerCase().replace(/-/g, '').indexOf(hex) === 0; });
        if (hit.length === 1) return hit[0];
      }
      for (i = 0; i < list.length; i++) {
        var c = norm(list[i].code);
        if (c && (c === n || c.replace(/-/g, '') === hex)) return list[i];
      }
      return null;
    }

    function alternatives(b) {
      var free = S.booths.filter(function (x) { return x.id !== b.id && bucketOf(x) === '여유'; });
      free.sort(function (x, y) { return (waitNum(x) - waitNum(y)) || core.compareCode(x.code, y.code); });
      var same = free.filter(function (x) { return x.zone_key === b.zone_key; });
      if (same.length) return { scope: 'zone', list: same.slice(0, 3) };
      if (free.length) return { scope: 'any', list: free.slice(0, 3) };
      return { scope: 'none', list: [] };
    }

    function hereHtml(b) {
      var mode = heroMode();
      var age = ageLine(b);
      var html = '<section class="here" aria-labelledby="here-label">' +
        '<p class="here__label" id="here-label"><i class="sq" aria-hidden="true"></i>지금 계신 부스</p>' +
        '<div class="here__main">' +
          '<div><span class="here__code">' + esc(b.code) + '</span><p class="here__name">' + esc(b.name) + '</p></div>' +
          '<div class="here__val">' + bigHtml(b) + '</div>' +
        '</div>';
      if (mode === 'live') {
        if (age) html += '<p class="here__age">' + esc(age) + '</p>';
      } else {
        html += '<p class="here__age">' + esc(offHint(mode)) + '</p>';
      }

      var k = bucketOf(b);
      if (mode === 'live' && (k === '보통' || k === '혼잡' || k === 'off')) {
        var alt = alternatives(b);
        html += '<div class="here__alts">';
        if (alt.scope === 'none') {
          html += '<p class="here__alts-h">바로 갈 수 있는 부스</p>' +
            '<p class="here__none">지금은 여유 부스가 없어요</p>' +
            '<button type="button" class="line-btn" data-act="sort-wait">대기 짧은 순으로 보기</button>';
        } else {
          html += '<p class="here__alts-h">' + (alt.scope === 'zone' ? '바로 갈 수 있는 같은 구역 부스' : '바로 갈 수 있는 다른 구역 부스') + '</p>' +
            '<ul class="alts">' + alt.list.map(function (x) {
              return '<li><button type="button" class="alt" data-go="' + esc(x.id) + '">' +
                '<span class="alt__code">' + esc(x.code) + '</span>' +
                '<span class="alt__name">' + esc(x.name) +
                  (alt.scope === 'any' ? '<span class="alt__zone">' + esc(x.zone_name) + '</span>' : '') + '</span>' +
                '<span class="alt__v"><i class="sq" aria-hidden="true"></i>' + (isNow(x) ? '바로' : waitNum(x) + '분') + '</span>' +
              '</button></li>';
            }).join('') + '</ul>';
        }
        html += '</div>';
      }
      html += '<div class="here__foot"><button type="button" class="link" data-act="here-close">전체 부스 보기</button></div>';
      return html + '</section>';
    }

    function renderHere() {
      var slot = $('here');
      var html = '';
      if (S.hereParam && !S.hereGone && S.hasData) {
        var b = resolveHere(S.hereParam);
        if (b) html = hereHtml(b);
        // 지난번 결과에 없다고 바로 '못 찾음' 이라 하지 않습니다. 서버에서 새로 받은 뒤에 판단합니다.
        else if (S.fresh) html = '<p class="notfound">이 안내 QR의 부스를 찾지 못했어요 · 아래 전체 목록에서 찾아 주세요</p>';
      }
      if (html === S.keys.here) return;
      S.keys.here = html;
      var restore = focusKey(slot);
      slot.innerHTML = html;
      slot.hidden = !html;
      restoreFocus(slot, restore);
    }

    /* ── 5. 큰 숫자 ────────────────────────────────────────────── */
    function heroMode() {
      if (!S.hasData) return S.failed ? 'error' : 'loading';
      var ph = S.info.phase;
      if (ph === 'after') return 'after';
      if (S.liveReady === false) return 'notready';
      return (ph === 'open' || S.preview) ? 'live' : ph;
    }

    // 운영 시간 밖일 때 '지금 계신 부스' 카드에 붙일 한 줄
    function offHint(mode) {
      var i = S.info || {};
      if (mode === 'before' || mode === 'notready') return '대기 시간은 행사 당일부터 여기에 표시돼요';
      if (mode === 'preopen') return '오늘 ' + (i.openTime || '') + '에 문을 열어요';
      if (mode === 'dayclosed') return '오늘 체험은 끝났어요';
      if (mode === 'after') return '행사가 끝났어요';
      return '';
    }

    function dateLine() {
      var s = S.settings || {};
      return [s.date_label, s.time_label].filter(Boolean).join(' · ');
    }

    function heroMessageHtml(mode) {
      var i = S.info || {};
      var label = '<p class="hero__label">' + esc(dateLine() || '부스 대기 현황') + '</p>';
      if (mode === 'loading') {
        return '<span class="ph ph--label" aria-hidden="true"></span><span class="ph ph--num" aria-hidden="true"></span>' +
          '<span class="ph ph--bar" aria-hidden="true"></span><p class="sr-only">불러오는 중</p>';
      }
      if (mode === 'error') {
        // 어떻게 하면 되는지와 다시 시도 단추는 바로 아래 목록 자리(failHtml)에 둡니다. 같은 말을 두 번 하지 않습니다.
        return '<p class="hero__label">부스 대기 현황</p><p class="hero__head">정보를 불러오지 못했어요</p>';
      }
      if (mode === 'before') {
        return label + '<p class="hero__dday">D-' + i.dday + '</p>' +
          '<p class="hero__copy">' + esc((i.nextOpenLabel || '행사 당일') + '부터 부스별 대기 시간이 여기에 실시간으로 표시돼요') + '</p>';
      }
      if (mode === 'notready') {
        return label + '<p class="hero__head">부스별 대기 시간은<br />행사 당일부터 표시돼요</p>';
      }
      if (mode === 'preopen') {
        return label + '<p class="hero__head">오늘 ' + esc(i.openTime) + '에 문을 열어요</p>' +
          '<p class="hero__copy">문을 열면 부스별 대기 시간이 여기에 실시간으로 표시돼요.</p>';
      }
      if (mode === 'dayclosed') {
        return label + '<p class="hero__head">오늘 체험은 끝났어요</p>' +
          (i.nextOpenLabel ? '<p class="hero__copy">' + esc(i.nextOpenLabel) + '에 다시 열려요</p>' : '');
      }
      if (mode === 'after') {
        return label + '<p class="hero__head">행사가 끝났어요.</p><p class="hero__copy">함께해 줘서 고마워요.</p>';
      }
      return '';
    }

    function heroLiveHtml() {
      return '<p class="hero__label" id="hero-label">지금 바로 체험할 수 있는 부스</p>' +
        '<div class="hero__fig">' +
          '<p class="hero__big"><span class="hero__num" id="h-free">0</span><span class="hero__unit">곳</span></p>' +
          '<p class="hero__total">전체 <b id="h-total">0</b>곳</p>' +
        '</div>' +
        '<p class="hero__sub" id="h-sub"></p>' +
        '<div class="dist" id="h-dist" aria-hidden="true">' +
          ['free', 'normal', 'busy', 'off', 'unknown'].map(function (k) {
            return '<i class="dist__s dist__s--' + k + '" data-seg="' + k + '"></i>';
          }).join('') +
        '</div>' +
        '<div class="counts" role="group" aria-label="상태별로 모아 보기">' +
          COUNT_KEYS.map(function (k) {
            return '<button type="button" class="count count--' + COUNT_CLS[k] + '" data-count="' + k + '" aria-pressed="false">' +
              '<span class="count__w"><i class="sq" aria-hidden="true"></i>' + COUNT_WORD[k] + '</span>' +
              '<span class="count__n"><span data-n>0</span><span class="sr-only">곳</span></span>' +
            '</button>';
          }).join('') +
        '</div>';
    }

    function renderHero(c) {
      var hero = $('hero');
      var mode = heroMode();
      if (mode !== 'live') {
        var html = heroMessageHtml(mode);
        if (S.keys.hero !== html) { S.keys.hero = html; hero.innerHTML = html; }
        return;
      }
      if (S.keys.hero !== 'live') {
        var restore = focusKey(hero);
        S.keys.hero = 'live';
        hero.innerHTML = heroLiveHtml();
        restoreFocus(hero, restore);
      }
      var fresh = c['여유'] + c['보통'] + c['혼잡'] + c.off;
      $('h-free').textContent = c['여유'];
      $('h-total').textContent = S.booths.length;
      $('h-sub').textContent = fresh ? '현재 대기 정보가 입력된 ' + fresh + '곳 기준' : '아직 대기 시간을 입력한 부스가 없어요';
      $('h-dist').hidden = !fresh;
      each($('h-dist').children, function (seg) {
        var k = seg.getAttribute('data-seg');
        var n = k === 'unknown' ? c.unknown : c[{ free: '여유', normal: '보통', busy: '혼잡', off: 'off' }[k]];
        seg.style.flexGrow = n;
        seg.hidden = !n;
      });
      each(hero.querySelectorAll('[data-count]'), function (btn) {
        var k = btn.getAttribute('data-count');
        var on = S.ui.count === k;
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.classList.toggle('is-zero', !c[k]);
        btn.querySelector('[data-n]').textContent = c[k];
      });
    }

    /* ── 6. 붙박이 줄 ──────────────────────────────────────────── */
    function renderBar() {
      var show = S.hasData && S.booths.length > 0;
      // 숨어 있던 탭 줄은 폭이 0 이라 그때 잰 흐림(is-more)이 틀립니다. 다시 보일 때 고쳐 잽니다.
      var tabsWereHidden = $('bar').hidden || $('bar-tabs').hidden;
      $('bar').hidden = !show;
      if (!show) { $('search-field').hidden = true; return; }
      var zs = zoneList();
      var multi = zs.length >= 2;
      if (!multi) S.ui.zone = '';
      // 구역이 하나뿐이면 탭이 필요 없으니 검색칸을 늘 펼쳐 둡니다.
      // 검색어가 남아 있으면 칸을 닫지 않습니다. 보이지 않는 검색어가 목록을 거르면 안 됩니다.
      var searchMode = !multi || S.ui.search || !!S.ui.q;
      if (multi && S.ui.q) S.ui.search = true;
      $('bar-tabs').hidden = searchMode;
      $('search').hidden = !searchMode;
      // 부스가 많으면 요약 아래에 검색칸 모양의 단추를 하나 더 둡니다(검색칸이 열려 있으면 숨김).
      $('search-field').hidden = searchMode || S.booths.length < SEARCH_FIELD_MIN;
      S.multi = multi;
      var cancel = $('search-cancel');
      if (multi) { cancel.textContent = '취소'; cancel.hidden = false; }
      else { cancel.textContent = '지우기'; cancel.hidden = !S.ui.q; }
      if (!multi) return;

      var key = zs.map(function (z) { return z.key + ':' + z.label + ':' + z.n; }).join(',') + '|' + S.ui.zone + '|' + S.booths.length;
      if (key === S.keys.tabs) {
        // 15초 · 20초마다 도는 그리기에서는 탭 줄을 건드리지 않습니다. 손으로 옆으로 밀어 둔
        // 자리를 되돌리지 않으려는 것입니다. 검색을 닫아 탭 줄이 다시 보일 때만 맞춥니다.
        if (tabsWereHidden && !searchMode) revealTab();
        return;
      }
      S.keys.tabs = key;
      var tabs = $('tabs');
      var restore = focusKey(tabs);
      // 탭에는 짧은 이름(A 스쿨존)만 둡니다. 전체 이름은 목록의 구역 제목 · 탭의 title 에 있습니다.
      // 구역이 ZONE_SELECT_MIN 곳 이상이면 탭을 늘어놓지 않고 [전체] · [고른 구역] · [구역 선택 ▾](아래 패널 — renderPick)으로 줄입니다.
      function tabHtml(z) {
        var on = S.ui.zone === z.key;
        var full = z.key ? z.label + ' · 부스 ' + z.n + '곳' : '전체 부스 ' + z.n + '곳';
        return '<button type="button" class="tab" data-zone="' + esc(z.key) + '" aria-pressed="' + on + '"' +
          ' title="' + esc(full) + '" aria-label="' + esc(full) + '">' +
          '<span class="tab__t">' + esc(z.key ? shortZone(z) : z.label) + '</span><span class="tab__n">' + z.n + '</span></button>';
      }
      var all = { key: '', label: '전체', n: S.booths.length };
      if (zs.length >= ZONE_SELECT_MIN) {
        var cur = zs.filter(function (z) { return z.key === S.ui.zone; })[0];
        tabs.innerHTML = tabHtml(all) + (cur ? tabHtml(cur) : '') +
          '<button type="button" class="tab tab--sel" id="zone-pick" data-act="zone-pick" aria-expanded="' + S.zpick + '" aria-controls="zone-panel">' +
            '<span class="tab__t">구역 선택</span><span class="tab__caret" aria-hidden="true">▾</span></button>';
      } else {
        tabs.innerHTML = [all].concat(zs).map(tabHtml).join('');
      }
      restoreFocus(tabs, restore);
      // 탭을 새로 만들어도 줄의 scrollLeft 는 그대로 남습니다. 여유 수 · 다른 구역 대안 ·
      // '대기 짧은 순' 이 구역 고름을 '전체' 로 풀면, 눌린 '전체' 탭이 왼쪽 화면 밖에
      // 남아 아무 탭도 골라지지 않은 것처럼 보입니다. 새로 만들 때만 눌린 탭을 보이게 합니다.
      // (탭 줄이 숨어 있으면 폭이 0 이라 잴 수 없으니, 다시 보일 때 위에서 맞춥니다.)
      if (!searchMode) revealTab();
    }

    /* '구역 선택' 패널 — 구역이 ZONE_SELECT_MIN 곳 이상일 때. 줄마다 구역 글자 · 이름 · 부스 수(구역별 현황과 같은 순서),
       고른 줄은 옅은 보라 바탕 + 왼쪽 보라 선 + 체크(aria-pressed). 상태색(초록 · 노랑 · 빨강)은 쓰지 않습니다.
       줄은 구역 탭과 같은 data-zone 단추라 고르는 동작은 탭과 같습니다(bind()). */
    var CHECK_SVG = '<svg class="zpick__chk" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true" focusable="false"><path d="M5 12.5 10 17.5 19 7.5" /></svg>';
    function pickRowHtml(key, keyHtml, name, n) {
      var on = S.ui.zone === key;
      return '<button type="button" class="zpick__row" data-zone="' + esc(key) + '" aria-pressed="' + on + '">' +
        '<span class="zpick__key">' + keyHtml + '</span><span class="zpick__name">' + esc(name) + '</span>' +
        '<span class="zpick__n">' + n + '곳</span>' + CHECK_SVG + '</button>';
    }
    function renderPick() {
      var panel = $('zone-panel');
      var zs = zoneList();
      var can = !$('bar').hidden && !$('bar-tabs').hidden && zs.length >= ZONE_SELECT_MIN;
      if (!can) S.zpick = false;
      var btn = $('zone-pick');
      if (btn) btn.setAttribute('aria-expanded', S.zpick ? 'true' : 'false');
      if (!S.zpick) {
        if (!panel.hidden) { panel.hidden = true; panel.innerHTML = ''; S.keys.pick = ''; }
        return;
      }
      var html = '<div class="col"><div class="zpick__box">' +
        pickRowHtml('', '', '전체 구역', S.booths.length) +
        zs.map(function (z) {
          var shown = zoneKeyShown(z);
          return pickRowHtml(z.key, shown ? esc(z.key) : '', z.label, z.n);
        }).join('') + '</div></div>';
      if (S.keys.pick !== html) {
        var restore = focusKey(panel);
        panel.innerHTML = html;
        S.keys.pick = html;
        restoreFocus(panel, restore);
      }
      panel.hidden = false;
    }
    // 패널 높이: 붙박이 줄 아래 남은 화면만큼(넘치면 패널 안에서 넘김). 남은 자리가 좁으면 먼저
    // 붙박이 줄이 맨 위에 붙도록 페이지를 올립니다 — 패널이 화면 밖으로 내려가 페이지를 밀지 않게.
    function fitPick() {
      var box = $('zone-panel').querySelector('.zpick__box');
      if (!box) return;
      var room = window.innerHeight - $('bar').getBoundingClientRect().bottom - 12;
      box.style.maxHeight = Math.max(200, Math.min(640, room)) + 'px';
    }
    function openPick() {
      var bar = $('bar'), r = bar.getBoundingClientRect();
      if (window.innerHeight - r.bottom < 360) {
        var stick = parseFloat(window.getComputedStyle(bar).top) || 0;
        if (r.top > stick + 1) window.scrollTo({ top: window.pageYOffset + r.top - stick, behavior: 'auto' });
      }
      S.zpick = true;
      renderPick();
      fitPick();
      var box = $('zone-panel').querySelector('.zpick__box');
      var on = box && (box.querySelector('[aria-pressed="true"]') || box.querySelector('.zpick__row'));
      if (on) {
        // 고른 줄이 패널 아래쪽이면 보이게 하고, 그 줄에 초점을 둡니다(화살표로 위아래 이동).
        box.scrollTop = Math.max(0, on.offsetTop - box.clientHeight / 2 + on.offsetHeight / 2);
        try { on.focus({ preventScroll: true }); } catch (e) { on.focus(); }
      }
    }
    function closePick(refocus) {
      if (!S.zpick) return;
      S.zpick = false;
      renderPick();
      if (refocus) { var b = $('zone-pick'); if (b) b.focus(); }
    }

    // 구역 탭의 짧은 이름. 관리자가 적은 구역 이름은 길 수 있어('피지컬 AI · 로봇 메이커존') 탭에는
    // 구역 코드와 이름의 끝말만 둡니다(A 메이커존). 이름이 이미 짧거나('로봇존' → 'A 로봇존')
    // 구역 코드가 들어 있으면('A구역') 그대로 씁니다. 표에 칸을 새로 두지 않고 이름에서 만듭니다.
    var ZONE_SELECT_MIN = 7;
    var SEARCH_FIELD_MIN = 20;
    function shortZone(z) {
      var key = String(z.key || ''), label = String(z.label || '').trim();
      if (!label) return key;
      var hasKey = label.indexOf(key) === 0 || label.split(/\s+/).indexOf(key) >= 0;
      if (label.length <= 6) return hasKey ? label : key + ' ' + label;
      var words = label.replace(/[·・|/,()]/g, ' ').split(/\s+/).filter(Boolean);
      var last = words.length ? words[words.length - 1] : label;
      if (last === key && words.length > 1) last = words[words.length - 2];
      return key + ' ' + last;
    }

    function tabsFade() {
      var t = $('tabs');
      t.classList.toggle('is-more', t.scrollWidth - t.clientWidth - t.scrollLeft > 4);
    }

    function revealTab() {
      var t = $('tabs');
      var on = t.querySelector('[aria-pressed="true"]');
      if (on) {
        var l = on.offsetLeft, r = l + on.offsetWidth;
        if (l < t.scrollLeft) t.scrollLeft = Math.max(0, l - 12);
        else if (r > t.scrollLeft + t.clientWidth - 32) t.scrollLeft = r - t.clientWidth + 40;
      }
      // 고른 탭이 없어도(사라진 구역 등) 흐림은 지금 폭으로 다시 잽니다.
      tabsFade();
    }

    /* ── 7. 보기 · 정렬 · 결과 줄 ─────────────────────────────── */
    function renderControls(items) {
      var show = S.hasData && S.booths.length > 0;
      // 운영 시간 밖에는 대기 시간이 없으니 '한눈에' · '대기 짧은 순' 이 뜻이 없습니다.
      $('controls').hidden = !show || !liveOn();
      each(document.querySelectorAll('[data-view]'), function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-view') === S.ui.view ? 'true' : 'false');
      });
      each(document.querySelectorAll('[data-sort]'), function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-sort') === S.ui.sort ? 'true' : 'false');
      });
      $('sort-seg').hidden = S.ui.view !== 'list';

      var res = $('result');
      res.hidden = !show;
      if (!show) return;
      var html;
      if (S.ui.count && liveOn()) {
        // 위의 숫자는 행사 전체 수라, 구역 안에서 거르는 중이면 구역과 실제 곳 수를 함께 알립니다.
        // '× 필터 해제' 는 이 상태 고름만 풉니다(구역 · 보기 · 정렬은 그대로).
        var zz = (!searchOpen() && S.ui.zone) ? zoneList().filter(function (z) { return z.key === S.ui.zone; })[0] : null;
        var word = COUNT_WORD[S.ui.count];
        html = '<span class="result__t">' + (zz ? esc(shortZone(zz)) + ' · ' : '') + esc(word) + ' 부스만 보는 중 <b>' + items.length + '곳</b></span>' +
          '<button type="button" class="link result__clear" data-act="clear-count" aria-label="' + esc(word) + ' 필터 해제">' +
            '<span class="result__x" aria-hidden="true">×</span>필터 해제</button>';
      } else if (searching()) {
        html = '검색 결과 <b>' + items.length + '곳</b>';
      } else {
        html = '<b>' + items.length + '곳</b>';
      }
      if (res.getAttribute('data-k') !== html) {
        var restore = focusKey(res);
        res.innerHTML = html;
        res.setAttribute('data-k', html);
        restoreFocus(res, restore);
      }
    }

    /* ── 8 · 9. 목록 · 한눈에 ──────────────────────────────────── */
    // 구역 글자가 이름에 이미 들어 있으면('A구역' · '예시 구역 A') 앞에 또 붙이지 않습니다.
    function zoneKeyShown(g) {
      var label = String(g.label);
      return /^[A-Za-z0-9]{1,3}$/.test(g.key) && label.indexOf(g.key) !== 0 && label.split(/\s+/).indexOf(g.key) < 0;
    }
    function zoneNameHtml(g) {
      return (zoneKeyShown(g) ? '<span class="zone__key">' + esc(g.key) + '</span>' : '') + esc(g.label);
    }
    function zoneHead(g, n) {
      return '<h2 class="zone" id="zone-' + esc(String(g.key).replace(/\s+/g, '_')) + '">' +
        '<span class="zone__label">' + zoneNameHtml(g) + '</span>' +
        '<span class="zone__n">' + n + '곳</span></h2>';
    }

    /* 구역별 현황 — 전체 + 한눈에에서 부스가 많을 때(ZONE_OVERVIEW_OVER 곳 초과) 타일을 모두 펼치지 않고
       구역마다 한 줄(이름 · 부스 수 · 분포 막대 · 상태별 수)로 줄여 구역끼리 견주게 합니다. 줄을 누르면
       그 구역이 골라지고(구역 탭과 같은 S.ui.zone) 한눈에는 그대로라 그 구역의 타일이 나옵니다.
       구역을 고르거나 · 검색어가 있거나 · 위의 상태 숫자로 거르면 결과가 적으니 타일을 바로 보여 줍니다.
       맨 위 요약은 행사 전체, 여기는 구역별, 구역을 고르면 부스별 — 같은 숫자를 되풀이하지 않습니다. */
    var ZONE_OVERVIEW_OVER = 30;
    function overviewOn() {
      return effView() === 'grid' && !S.ui.zone && !searching() && !S.ui.count &&
        S.booths.length > ZONE_OVERVIEW_OVER && zoneList().length >= 2;
    }
    function overviewHtml() {
      var zs = zoneList(), by = {};
      S.booths.forEach(function (b) {
        var c = by[b.zone_key] || (by[b.zone_key] = { '여유': 0, '보통': 0, '혼잡': 0, 'off': 0, 'unknown': 0 });
        c[bucketOf(b)]++;
      });
      return '<section class="group zov" aria-labelledby="zov-h">' +
        '<h2 class="zone" id="zov-h"><span class="zone__label">구역별 현황</span><span class="zone__n">' + zs.length + '개 구역</span></h2>' +
        '<ul class="zov__list">' + zs.map(function (z) {
          var c = by[z.key];
          var segs = COUNT_KEYS.concat('unknown').map(function (k) {
            return c[k] ? '<i class="dist__s dist__s--' + COUNT_CLS[k] + '" style="flex-grow:' + c[k] + '"></i>' : '';
          }).join('');
          var nums = COUNT_KEYS.map(function (k) {
            return '<span class="zov__c' + (c[k] ? '' : ' is-zero') + '"><i class="sq sq--' + COUNT_CLS[k] + '"></i>' +
              COUNT_WORD[k] + ' <b>' + c[k] + '</b></span>';
          }).join('') + (c.unknown ? '<span class="zov__c zov__c--unknown">정보 없음 <b>' + c.unknown + '</b></span>' : '');
          var speech = [(zoneKeyShown(z) ? z.key + ' ' : '') + z.label, '전체 ' + z.n + '곳']
            .concat(COUNT_KEYS.map(function (k) { return COUNT_WORD[k] + ' ' + c[k] + '곳'; }))
            .concat(c.unknown ? ['정보 없음 ' + c.unknown + '곳'] : []).join(', ') + '. 이 구역 부스 보기';
          return '<li><button type="button" class="zov__btn" data-zone-go="' + esc(z.key) + '" aria-label="' + esc(speech) + '">' +
            '<span class="zov__top"><span class="zov__name">' + zoneNameHtml(z) + '</span>' +
              '<span class="zov__n">' + z.n + '곳</span><span class="zov__go" aria-hidden="true">›</span></span>' +
            '<span class="dist zov__bar" aria-hidden="true">' + segs + '</span>' +
            '<span class="zov__counts" aria-hidden="true">' + nums + '</span>' +
          '</button></li>';
        }).join('') + '</ul></section>';
    }

    function moreHtml(b) {
      var age = ageLine(b);
      // 운영 학교는 접힌 줄에 이미 보이므로 펼친 내용에는 구역만 둡니다.
      var meta = b.zone_name || '';
      return (meta ? '<p class="more__meta">' + esc(meta) + '</p>' : '') +
        (b.program ? '<p class="more__prog">' + esc(b.program) + '</p>' : '') +
        (age ? '<p class="more__age">' + esc(age) + '</p>' : '');
    }

    // 줄: 번호 | 부스 이름 + 운영 학교(한 줄, 넘치면 …) | 대기 분 + 상태 칩.
    // 학교 이름은 '운영기관:' 같은 꼬리표 없이 이름만(예시 부스의 내부 표시는 orgText 가 뗍니다).
    function rowHtml(b, grouped) {
      var open = !!S.open[b.id], did = domId(b.id), org = orgText(b);
      return '<li class="' + rowCls(b) + '" data-id="' + esc(b.id) + '">' +
        '<button type="button" class="row__main" aria-expanded="' + open + '" aria-controls="more-' + did + '">' +
          '<span class="row__code">' + esc(codeLabel(b)) + '</span>' +
          '<span class="row__body"><span class="row__name">' + esc(b.name || '이름 미정') + '</span>' +
            (org ? '<span class="row__org">' + esc(org) + '</span>' : '') + '</span>' +
          '<span class="row__right">' + rightHtml(b) + '</span>' +
        '</button>' +
        '<div class="row__more" id="more-' + did + '"' + (open ? '' : ' hidden') + '>' + moreHtml(b) + '</div>' +
      '</li>';
    }

    function tileParts(b) {
      if (!liveOn()) return { cls: 'is-idle', v: '', w: '' };
      var c = b.congestion;
      if (!c) return { cls: 'is-unknown', v: '—', w: '정보 없음' };
      if (c === '마감') return { cls: 'is-closed', v: '마감', w: '' };
      if (c === '중단') return { cls: 'is-pause', v: '중단', w: '' };
      var v = isNow(b) ? '바로' : waitNum(b) + '<span class="tile__u">분</span>';
      return { cls: 'is-' + core.meta(c).key, v: v, w: c };
    }

    function tileInner(b) {
      var p = tileParts(b);
      var no = (b.no !== null && b.no !== undefined && b.no !== '') ? pad2(b.no) : b.code;
      return '<span class="tile__no">' + esc(no) + '</span>' +
        '<span class="tile__v">' + p.v + '</span>' +
        '<span class="tile__w">' + esc(p.w) + '</span>';
    }

    function tileLabel(b) {
      return [b.code, b.name].filter(Boolean).join(' ') + (liveOn() ? ', ' + statusSpeech(b) : '');
    }

    function tileHtml(b) {
      var sel = S.sel === b.id;
      return '<button type="button" class="tile ' + tileParts(b).cls + (sel ? ' is-sel' : '') + '" data-id="' + esc(b.id) + '"' +
        ' aria-expanded="' + sel + '" aria-controls="sheet" aria-label="' + esc(tileLabel(b)) + '">' + tileInner(b) + '</button>';
    }

    function safeMapUrl(u) {
      u = String(u || '').trim();
      if (!u) return '';
      // 관리자가 넣는 값이지만, 주소 칸에 스크립트가 들어가도 실행되지 않게 http(s) 만 받습니다.
      // 글자 모양으로 'javascript:' 를 거르면 'java<탭>script:' 처럼 브라우저가 읽을 때 지우는
      // 글자(탭 · 줄바꿈)로 빠져나갈 수 있습니다. 그래서 브라우저가 실제로 읽은 결과를 보고,
      // 그 읽은 주소(절대 주소)를 그림과 '크게 보기' 양쪽에 씁니다. 상대 경로도 이렇게 계속 됩니다.
      var a = document.createElement('a');
      a.href = u;
      return (a.protocol === 'http:' || a.protocol === 'https:') ? a.href : '';
    }

    function mapHtml() {
      var url = safeMapUrl(S.settings.booth_map_url);
      if (!url) return '';
      var alt = S.settings.booth_map_alt || '부스 배치도';
      return '<div class="map">' +
        '<button type="button" class="map__toggle" data-act="map" aria-expanded="' + S.mapOpen + '" aria-controls="map-fig">' +
          '<i class="sq" aria-hidden="true"></i>' + (S.mapOpen ? '실제 배치도 닫기' : '실제 배치도 보기') + '</button>' +
        '<figure class="map__fig" id="map-fig"' + (S.mapOpen ? '' : ' hidden') + '>' +
          // 그림은 처음 펼칠 때 주소를 넣습니다. 보지 않는 사람까지 큰 그림을 받게 하지 않으려는 것입니다.
          '<img alt="' + esc(alt) + '" loading="lazy" decoding="async"' + (S.mapOpen ? ' src="' + esc(url) + '"' : ' data-src="' + esc(url) + '"') + ' />' +
          '<figcaption><a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">크게 보기</a></figcaption>' +
        '</figure>' +
      '</div>';
    }

    function emptyHtml(t, d) {
      return '<div class="empty"><p class="empty__t">' + esc(t) + '</p>' + (d ? '<p class="empty__d">' + esc(d) + '</p>' : '') + '</div>';
    }

    // 실제 부스가 한 곳도 없을 때 '부스 정보 준비 중' 아래에 붙는 협의용 예시 입구.
    // 실제 부스가 한 곳이라도 생기면 이 안내까지 오지 않으니 저절로 사라집니다(?demo=1 주소는 계속 열림).
    // 예시는 이 페이지에 섞지 않고 새로 연 페이지(?demo=1)에서만 그립니다. 그쪽은 서버를 읽지도
    // 쓰지도 않고, 실제 화면이 받아 둔 값(S · 지난번 결과)과 따로 돕니다.
    function demoCtaHtml() {
      return '<div class="democta">' +
        '<p class="democta__head"><span class="demotag">협의용 예시</span><span class="democta__t">실제 행사 정보가 아닙니다.</span></p>' +
        '<p class="democta__d">실제 부스가 등록되면 이 화면이 어떤 모습이 되는지 예시 부스로 미리 볼 수 있어요.</p>' +
        '<a class="line-btn democta__btn" href="?demo=1">협의용 예시 화면 보기</a>' +
      '</div>';
    }

    function skeletonHtml() {
      var h = '<div aria-hidden="true">';
      for (var i = 0; i < 6; i++) h += '<div class="sk"><i></i><i></i><i></i></div>';
      return h + '</div>';
    }

    // 초점이 있던 요소를 다시 만든 뒤에도 같은 자리로 돌려놓기 위한 표식
    function focusKey(root) {
      var ae = document.activeElement;
      if (!ae || ae === document.body || !root.contains(ae)) return null;
      var attrs = ['data-id', 'data-count', 'data-zone', 'data-zone-go', 'data-go', 'data-act'];
      for (var i = 0; i < attrs.length; i++) {
        var host = ae.closest('[' + attrs[i] + ']');
        if (host && root.contains(host)) {
          return { attr: attrs[i], val: host.getAttribute(attrs[i]), main: ae.classList.contains('row__main') };
        }
      }
      return null;
    }
    function restoreFocus(root, k) {
      if (!k) return;
      var els = root.querySelectorAll('[' + k.attr + ']');
      for (var i = 0; i < els.length; i++) {
        if (els[i].getAttribute(k.attr) !== k.val) continue;
        var el = k.main ? els[i].querySelector('.row__main') : els[i];
        if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
        return;
      }
    }

    // 한 번도 받지 못했을 때(지난번 결과도 없음) 빈 줄 대신 두는 안내와 다시 시도 단추.
    // 큰 숫자 자리는 '정보를 불러오지 못했어요' 만 말하고, 무엇을 하면 되는지는 여기서 말합니다.
    function failHtml() {
      var d = '연결되면 자동으로 다시 불러와요. 지금 바로 다시 시도할 수도 있어요.';
      // 누른 단추가 먹었는지 보이도록, 받는 중에는 단추 글자를 바꿉니다(단추는 그대로 두어 초점 유지).
      var btn = busy ? '다시 불러오는 중…' : '다시 불러오기';
      return '<div class="empty empty--none empty--fail"><p class="empty__d">' + esc(d) + '</p>' +
        '<button type="button" class="line-btn" data-act="retry">' + esc(btn) + '</button></div>';
    }

    function renderList(items, force) {
      var box = $('list');
      if (!S.hasData) {
        // 처음 그릴 때(render(true))는 늘 빈 줄이라, 이미 그린 것과 '지금 보여야 할 것' 을 견줘야
        // 받기에 실패한 뒤 빈 줄이 안내로 바뀝니다. 빈 줄만 남으면 계속 불러오는 중처럼 보입니다.
        var want = S.failed ? 'error:' + failHtml() : 'skeleton';
        if (S.keys.list !== want) {
          var restoreSk = focusKey(box);
          box.innerHTML = S.failed ? failHtml() : skeletonHtml();
          S.keys.list = want;
          restoreFocus(box, restoreSk);
        }
        return;
      }
      if (!S.booths.length) {
        if (S.keys.list !== 'none') {
          S.keys.list = 'none';
          box.innerHTML = emptyHtml('부스 정보 준비 중', '부스 배치가 확정되면 이곳에 표시돼요.').replace('class="empty"', 'class="empty empty--none"') +
            (core.isMock ? '' : demoCtaHtml());
        }
        return;
      }

      var view = effView(), grouped = view === 'grid' ? true : isGrouped();
      if (overviewOn()) {
        // 숫자가 바뀌면 통째로 다시 만듭니다(열 줄 남짓이라 가볍고, 초점은 data-zone-go 로 이어집니다).
        var ov = mapHtml() + overviewHtml();
        if (force || S.keys.list !== 'ov|' + ov) {
          var restoreOv = focusKey(box);
          box.innerHTML = ov;
          S.keys.list = 'ov|' + ov;
          restoreFocus(box, restoreOv);
        }
        return;
      }
      // patch() 는 상태 칸만 고칩니다. 그래서 이름 · 학교 · 번호 · 구역 이름이 바뀌면(5분마다 전부
      // 다시 받을 때 관리자가 고친 값) 줄을 새로 만들어야 합니다. 펼침(S.open)과 초점은
      // 새로 만들어도 이어집니다. 한눈에 타일은 code 대신 no 를 보여 주니 no 도 넣습니다.
      var key = [view, grouped ? 'g' : 'f', liveOn() ? 1 : 0, safeMapUrl(S.settings.booth_map_url),
        zoneList().map(function (z) { return z.key + ':' + z.label; }).join(','),
        items.map(function (b) { return [b.id, b.no, b.code, b.name, orgText(b)].join(':'); }).join(',')].join('|');

      if (!force && key === S.keys.list) {
        patch(box, items, view);
      } else {
        S.keys.list = key;
        var restore = focusKey(box);
        if (!items.length) {
          box.innerHTML = emptyHtml(searching() ? '찾는 부스가 없어요' : '조건에 맞는 부스가 없어요',
            searching() ? '부스 이름 · 번호 · 체험 내용의 일부로 찾아 보세요.' : '다른 구역이나 상태를 골라 보세요.');
        } else if (view === 'grid') {
          box.innerHTML = mapHtml() + zoneGroups(items).map(function (g) {
            return '<section class="group">' + zoneHead(g, g.items.length) +
              '<div class="tiles">' + g.items.map(tileHtml).join('') + '</div></section>';
          }).join('');
        } else if (grouped) {
          box.innerHTML = zoneGroups(items).map(function (g) {
            return '<section class="group">' + zoneHead(g, g.items.length) +
              '<ul class="rows">' + g.items.map(function (b) { return rowHtml(b, true); }).join('') + '</ul></section>';
          }).join('');
        } else {
          box.innerHTML = '<ul class="rows">' + items.map(function (b) { return rowHtml(b, false); }).join('') + '</ul>';
        }
        restoreFocus(box, restore);
      }

      // 값이 바뀐 줄 표시
      for (var id in S.changed) {
        if (!Object.prototype.hasOwnProperty.call(S.changed, id)) continue;
        var el = findById(box, view === 'grid' ? '.tile' : '.row', id);
        if (el) flash(el);
      }
    }

    // 이미 있는 줄 · 타일의 글자와 상태만 바꿉니다(펼침 · 초점 유지).
    function patch(box, items, view) {
      items.forEach(function (b) {
        if (view === 'grid') {
          var t = findById(box, '.tile', b.id);
          if (!t) return;
          var cls = 'tile ' + tileParts(b).cls + (S.sel === b.id ? ' is-sel' : '') + (t.classList.contains('is-changed') ? ' is-changed' : '');
          if (t.className !== cls) t.className = cls;

        if (!li) return;
        var rc = rowCls(b) + (li.classList.contains('is-changed') ? ' is-changed' : '');
        if (li.className !== rc) li.className = rc;
        var right = rightHtml(b), slot = li.querySelector('.row__right');
        if (slot._html !== right) { slot.innerHTML = right; slot._html = right; }
        var more = moreHtml(b), m = li.querySelector('.row__more');
        if (m._html !== more) { m.innerHTML = more; m._html = more; }
      });
    }

    function flash(el) {

      el.classList.add('is-changed');

    }

    /* 한눈에: 아래에 붙는 상세 */
    function sheetHtml(b) {
      var meta = [orgText(b), b.zone_name].filter(Boolean).join(' · ');
      var age = ageLine(b);
      return '<p class="sheet__name" id="sheet-name">' + esc(b.name) + '</p>' +
        (meta ? '<p class="sheet__meta">' + esc(meta) + '</p>' : '') +
        (b.program ? '<p class="sheet__prog">' + esc(b.program) + '</p>' : '') +
        '<div class="sheet__live"><div class="sheet__val">' + bigHtml(b) + '</div>' +

    }

    function renderSheet(items) {
      var sh = $('sheet');
      var b = (S.sel && effView() === 'grid' && !overviewOn()) ? S.byId[S.sel] : null;
      if (b && !items.some(function (x) { return x.id === b.id; })) b = null; // 걸러져 안 보이면 닫습니다

      document.body.style.paddingBottom = sh.offsetHeight + 'px';
    }

    function renderSummary(c) {
      if (heroMode() !== 'live') return;
      var key = [c['여유'], c['보통'], c['혼잡'], c.off].join('|');
      if (key === S.keys.sum) return;
      S.keys.sum = key;
      $('sr-summary').textContent = '여유 ' + c['여유'] + '곳, 보통 ' + c['보통'] + '곳, 혼잡 ' + c['혼잡'] +
        '곳, 중단·마감 ' + c.off + '곳.';
    }

    /* ── 한꺼번에 ─────────────────────────────────────────────── */
    function render(force) {
      derive();
      var c = counts();
      // 고른 상태가 이제 뜻이 없으면(운영 시간이 끝남 등) 풉니다.
      if (S.ui.count && !liveOn()) S.ui.count = '';
      var items = visible();
      renderBand();
      renderStrip();
      renderHere();
      renderHero(c);
      renderBar();
      renderPick();
      renderControls(items);
      renderList(items, force);
      renderSheet(items);
      renderSummary(c);
      S.changed = {};
    }

    /* ── 받기 ─────────────────────────────────────────────────── */
    function sigOf(b) { return (b.congestion || '') + '|' + (b.wait_minutes === null ? '' : b.wait_minutes); }

    function take(list) {
      var next = {};
      (list || []).forEach(function (b) {
        var s = sigOf(b);
        next[b.id] = s;
        if (S.prevSig && Object.prototype.hasOwnProperty.call(S.prevSig, b.id) && S.prevSig[b.id] !== s) S.changed[b.id] = true;
      });
      S.prevSig = next;
      S.raw = list || [];
      S.hasData = true;
    }

    var busy = false;   // 받는 중(single-flight)
    var timer = null;   // 다음 받기
    var fails = 0;      // 이어진 실패 수(성공하면 0)
    var lastTry = 0;

    // 스냅샷 하나를 받습니다. 받는 중이면 겹쳐 보내지 않고, 끝나면(성공이든 실패든) 다음 받기를 잡습니다.
    // 실패해도 화면의 값은 그대로 둡니다(마지막 정상본). Supabase 로 돌아가 읽는 길은 없습니다.
    function refresh() {
      if (busy) return;
      busy = true;
      lastTry = Date.now();
      clearTimeout(timer);
      timer = null;
      core.getLiveSnapshot().then(function (data) {
        busy = false;
        fails = 0;
        S.settings = data.settings || {};
        S.zones = data.zones || [];
        S.liveReady = data.liveReady;
        take(data.booths);
        S.mode = data.mode || 'normal';
        // 서버가 새로 만든 스냅샷일 때만 '새로 받음' 으로 셉니다. CDN 은 같은 사본을 몇 번 더 줄 수 있습니다.
        if (!S.movedAt || data.generatedAt !== S.genAt) { S.genAt = data.generatedAt; S.movedAt = Date.now(); }
        S.fresh = true;
        S.failed = false;
        render(false);
        schedule();
      }, function (err) {
        busy = false;
        fails++;
        // 끊긴 동안 같은 경고가 쌓이지 않게, 처음 실패했을 때만 남깁니다.
        if (!S.failed && window.console) console.warn('[부스 대기 현황] 받지 못했어요', err);

        render(false);
        schedule();

    }

    // 다음 받기를 잡습니다. 화면이 가려져 있으면 잡지 않습니다 — 다시 보일 때 resume() 이 받습니다.
    //   자동으로 받는 동안    정상 POLL_MS × 배수 ± 1/6. 실패가 이어지면 BACKOFF_MS(±15%)와 지금 간격 중 긴 쪽.
    //   자동으로 받지 않는 동안  다시 시도하지 않습니다. 행사 시간이 곧 시작되면 그때(관람객마다 0~60초
    //                          흩뜨려) 한 번 깨어나 받고, 그 뒤로는 위 규칙을 따릅니다. manual 이면 깨지 않습니다.
    function schedule() {
      clearTimeout(timer);
      timer = null;
      if (document.hidden) return;
      var now = Date.now(), f = autoFactor(now);
      if (!f) {
        var w = liveWindow(now);
        if (!w.next || S.mode === 'manual') return;
        var wait = w.next - now + Math.random() * 60000;
        // 아주 먼 때는 바로 잡지 않고 6시간 뒤에 다시 따집니다(setTimeout 의 32비트 한도 · 기기 잠자기).
        timer = wait > 6 * 3600000 ? setTimeout(schedule, 6 * 3600000) : setTimeout(tick, wait);
        return;
      }
      var base = waitBase(f), spread = fails ? base * 0.15 : base / 6;
      timer = setTimeout(tick, base - spread + Math.random() * 2 * spread);
    }
    // 잡아 둔 차례가 왔을 때. 그 사이 자동으로 받는 시간대가 끝났으면(예: 17:29 에 잡은 차례가 17:30 뒤에 옴)
    // 받지 않고 다음 행사 날 시작으로 다시 잡습니다.
    function tick() {
      timer = null;
      if (!autoFactor(Date.now())) { schedule(); return; }
      refresh();
    }
    // 다음 받기까지의 기본 간격(흩뜨리기 전). 실패가 이어지면 BACKOFF_MS 와 지금 간격 중 긴 쪽.
    function waitBase(f) {
      var base = POLL_MS * (f || 1);
      return fails ? Math.max(base, BACKOFF_MS[Math.min(fails, BACKOFF_MS.length) - 1]) : base;
    }

    // 곧바로 받습니다. user 가 아니면(다시 보임 · 인터넷 복귀) 방금(MIN_GAP_MS 안) 받은 뒤에는 받지 않고
    // 잡아 둔 차례를 기다립니다 — 탭을 빠르게 오가도 요청이 몰리지 않게. 실패가 이어지는 동안에는
    // 늦춘 간격(waitBase)도 지킵니다 — 장애 때 앱을 오가는 관람객이 정상일 때보다 자주 받지 않게.
    // user('새로고침' · '다시 불러오기')는 MANUAL_GAP_MS 안에서 한 번만 받습니다.
    function resume(user) {
      if (document.hidden || busy) return;
      var gap = user ? MANUAL_GAP_MS : (fails ? waitBase(autoFactor(Date.now())) * 0.85 : MIN_GAP_MS);
      if (Date.now() - lastTry < gap) { if (!timer) schedule(); return; }
      refresh();
    }

    /* ── 뒤로 가기(휴대폰 · 브라우저) ─────────────────────────────
       화면 안에서 고른 것(구역 · 상태 고름 · 연 상세 · 지금 계신 부스 안내)이 있으면 뒤로 가기가 그것을 한 단계씩
       되돌리고, 기본 화면까지 오면 그다음부터는 브라우저의 원래 동작(이전 페이지 · 인앱 브라우저 닫기)입니다.
         · 기록 한 칸에는 그 네 가지만 담습니다(nav). 단계(navDepth)가 깊어질 때만 새 칸을 쌓고(pushState),
           같은 단계 안의 바꿈(구역 A → B, 상세 C-01 → C-02)은 지금 칸을 고쳐 씁니다(replaceState).
         · 화면에서 직접 한 단계 위로 나가면('× 필터 해제' · 같은 숫자 다시 · ✕ · 줄 접기 · Esc · '전체' 탭) 바로 아래 칸이
           이 페이지가 쌓은 같은 상태일 때만 history.back() 으로 그 칸을 거둡니다. 켰다 껐다 해도 칸이 쌓이지 않고,
           이 페이지가 만들지 않은 칸으로는 가지 않습니다. 그 밖에는 지금 칸만 고칩니다.
         · 검색어 · 정렬 · 목록/한눈에는 기록에 넣지 않습니다(글자마다 · 누를 때마다 칸이 생기지 않게).
         · 뒤로 가기는 이미 받은 값으로 다시 그리기만 합니다(서버에 묻지 않음). 스크롤은 브라우저가 옮기지 않게 하고
           (scrollRestoration manual) 구역 · 상태가 바뀌었을 때만 결과 줄이 보이게 맞춥니다 — 상세를 닫으면 보던 자리 그대로.
         · ?b=(부스 앞 안내 QR)로 들어오면 기본 칸(주소에서 b 를 뗀 것) 위에 안내 칸을 하나 쌓습니다. 첫 뒤로 가기는
           안내를 닫고 목록으로, 그다음부터 브라우저 동작입니다. 지금 칸의 주소에는 ?b= 가 그대로라 공유 · 새로 고침도 같습니다. */
    var NAV_V = 1;
    var NAV = { list: [], i: 0, ready: false, base: '', here: '' };
    function openRow() {
      var ids = Object.keys(S.open);
      if (!ids.length) return null;
      return { id: S.open[S.lastRow] ? S.lastRow : ids[ids.length - 1], k: 'row' };
    }
    function navNow() {
      var d = S.sel ? { id: S.sel, k: 'tile' } : openRow();
      return { v: NAV_V, n: NAV.i, zone: S.ui.zone || '', count: S.ui.count || '', d: d ? d.id : '', dk: d ? d.k : '', here: !!(S.hereParam && !S.hereGone) };
    }
    function navDepth(st) { return (st.zone ? 1 : 0) + (st.count ? 1 : 0) + (st.d ? 1 : 0) + (st.here ? 1 : 0); }
    function navSame(a, b) { return !!a && !!b && a.zone === b.zone && a.count === b.count && a.d === b.d && a.here === b.here; }
    function navUrl(st) { return st.here ? NAV.here : NAV.base; }
    // 화면의 고름을 바꾼 뒤 부릅니다. up: 사용자가 직접 한 단계 위로 나간 경우(아래 칸을 거둘 수 있음).
    function navCommit(up) {
      if (!NAV.ready) return;
      var cur = NAV.list[NAV.i], next = navNow();
      if (navSame(cur, next)) return;
      try {
        var dn = navDepth(next), dc = cur ? navDepth(cur) : 0;
        if (dn > dc) {
          NAV.i += 1;
          next.n = NAV.i;
          NAV.list.length = NAV.i;   // 앞으로 가기 칸은 버립니다(브라우저와 같게)
          NAV.list.push(next);
          history.pushState(next, '', navUrl(next));
        } else if (up && dn < dc && NAV.i > 0 && navSame(NAV.list[NAV.i - 1], next)) {
          NAV.i -= 1;                // popstate 가 오기 전에 다음 고름이 와도 자리가 맞게
          history.back();
        } else {
          next.n = NAV.i;
          NAV.list[NAV.i] = next;
          history.replaceState(next, '', navUrl(next));
        }
      } catch (e) { /* 기록을 쓸 수 없는 환경: 화면만 바꿉니다 */ }
    }
    // 기록 한 칸의 상태로 화면을 맞춥니다(받기 없음). draw: 바로 다시 그릴지(시작 전에는 false).
    function navApply(st, draw) {
      var moved = S.ui.zone !== (st.zone || '') || S.ui.count !== (st.count || '');
      S.zpick = false;
      S.ui.zone = st.zone || '';
      S.ui.count = st.count || '';
      // 상태 고름과 검색은 함께 걸지 않습니다(숫자 단추를 누를 때와 같게).
      if (S.ui.count && (S.ui.q || S.ui.search)) {
        if (document.activeElement === $('q')) $('q').blur();
        S.ui.q = ''; S.ui.search = false; $('q').value = '';
      }
      if (S.hereParam) S.hereGone = !st.here;
      S.sel = null;
      S.open = {};
      if (st.d) {
        if (st.dk === 'tile') S.sel = st.d;
        else { S.open[st.d] = true; S.lastRow = st.d; }
      }
      if (!draw) return;
      render(true);
      if (moved) showResults(true, true);
    }
    function navStart() {
      try {
        var u = new URL(location.href);
        u.searchParams.delete('b');
        NAV.base = u.pathname + u.search + u.hash;
        NAV.here = location.pathname + location.search + location.hash;
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var st = history.state;
        if (st && st.v === NAV_V && typeof st.n === 'number') {

          NAV.i = st.n;
          NAV.list = [];
          NAV.list[st.n] = st;
          navApply(st, false);
        } else {
          var base = { v: NAV_V, n: 0, zone: '', count: '', d: '', dk: '', here: false };
          NAV.list = [base];
          NAV.i = 0;
          history.replaceState(base, '', NAV.base);
          if (S.hereParam) {
            var h = { v: NAV_V, n: 1, zone: '', count: '', d: '', dk: '', here: true };
            NAV.list.push(h);
            NAV.i = 1;
            history.pushState(h, '', NAV.here);

      } catch (e) { NAV.ready = false; }
    }
    // '× 필터 해제' · Esc: 상태 고름만 풉니다(구역 · 검색 · 보기 · 정렬은 그대로).
    function clearCount() {
      S.ui.count = '';
      navCommit(true);
      render(false);
    }
    // Esc 로 펼친 줄 하나를 접습니다(마지막으로 펼친 줄부터).
    function closeRow(id) {
      delete S.open[id];
      if (S.lastRow === id) S.lastRow = null;
      var li = findById($('list'), '.row', id);
      if (li) {
        var btn = li.querySelector('.row__main');
        btn.setAttribute('aria-expanded', 'false');
        li.querySelector('.row__more').hidden = true;
        try { btn.focus({ preventScroll: true }); } catch (e) { /* 옛 브라우저 */ }

      navCommit(true);
    }

    /* ── 손가락 ───────────────────────────────────────────────── */
    // 걸러진 목록이 화면 밖에 있으면 결과 줄이 보이는 데까지만 내려 줍니다.
    // instant: 검색칸에 치는 동안처럼 곧바로 다음 그리기가 오는 경우, 부드러운 이동 없이 옮깁니다.
    function showResults(fromBar, instant) {
      var res = $('result');
      if (res.hidden) return;
      // 예시 화면에서는 맨 위 '협의용 예시' 띠도 붙박이라, 그 높이까지 더해 가리지 않게 합니다.
      var barH = ($('bar').hidden ? 0 : $('bar').offsetHeight) + ($('demobar').hidden ? 0 : $('demobar').offsetHeight);
      var top = res.getBoundingClientRect().top;
      if (fromBar ? top < barH : top > window.innerHeight - 160) {
        var y = window.pageYOffset + top - barH - 8;
        if (!fromBar) y = window.pageYOffset + (top - (window.innerHeight - 200));
        window.scrollTo({ top: Math.max(0, y), behavior: instant ? 'auto' : smooth() });
      }
    }

    function openSearch() {
      S.ui.search = true;
      render(false);
      $('q').focus();
    }
    function closeSearch(refocus) {
      var had = !!S.ui.q;
      S.ui.search = false;
      S.ui.q = '';
      $('q').value = '';
      render(had);
      if (refocus) { var b = $('search-open'); if (b && !b.closest('[hidden]')) b.focus(); }
    }

    // 지금 계신 부스의 대안을 누르면, 그 부스 줄을 펼쳐 보여 줍니다.
    function goRow(id) {
      S.ui.view = 'list';
      S.ui.count = '';
      S.ui.zone = '';
      if (S.ui.q || S.ui.search) { S.ui.q = ''; S.ui.search = false; $('q').value = ''; }
      S.sel = null;
      S.open[id] = true;
      S.lastRow = id;
      navCommit(false);
      render(true);
      var li = findById($('list'), '.row', id);
      if (!li) return;
      li.scrollIntoView({ block: 'start', behavior: smooth() });
      var btn = li.querySelector('.row__main');
      try { btn.focus({ preventScroll: true }); } catch (e) { /* 옛 브라우저 */ }
      flash(li);
    }

    function selectTile(id, btn) {
      if (S.sel === id) { closeSheet(true); return; }
      var prev = S.sel ? findById($('list'), '.tile', S.sel) : null;
      if (prev) { prev.classList.remove('is-sel'); prev.setAttribute('aria-expanded', 'false'); }
      S.sel = id;
      navCommit(false);
      btn.classList.add('is-sel');
      btn.setAttribute('aria-expanded', 'true');
