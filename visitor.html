      // 고른 타일이 상세에 가려지면 살짝 올립니다.
      var r = btn.getBoundingClientRect(), sh = $('sheet').offsetHeight;
      if (r.bottom > window.innerHeight - sh - 8) {
        window.scrollBy({ top: r.bottom - (window.innerHeight - sh - 16), behavior: smooth() });
      }
    }
    function closeSheet(refocus) {
      var id = S.sel;
      S.sel = null;
      navCommit(true);
      var t = id ? findById($('list'), '.tile', id) : null;
      if (t) { t.classList.remove('is-sel'); t.setAttribute('aria-expanded', 'false'); }
      renderSheet([]);
      if (refocus && t) t.focus();
    }

    function bind() {
      // '구역 선택' 패널 밖을 누르면 닫습니다(패널을 여는 단추는 아래 click 에서 열고 닫음).
      document.addEventListener('click', function (e) {
        if (!S.zpick) return;
        if (e.target.closest && (e.target.closest('#zone-panel') || e.target.closest('#zone-pick'))) return;
        closePick(false);
      }, true);
      document.addEventListener('click', function (e) {
        var t = e.target.closest('button, [data-act]');
        if (!t) return;

        if (t.hasAttribute('data-count')) {
          var k = t.getAttribute('data-count');
          var countOff = S.ui.count === k;
          S.ui.count = countOff ? '' : k;
          // 고른 구역은 그대로 두고 그 안에서 거릅니다(구역 → 여유 → 뒤로 가기 → 구역). 위의 숫자는
          // 행사 전체 수라 구역 안의 곳 수와 다를 수 있어, 결과 줄이 구역 이름과 실제 곳 수를 함께 알립니다.
          // 남아 있는 검색어는 지우고 검색칸을 닫습니다. 검색과 겹쳐 걸면
          // '여유 4' 를 눌렀는데 1곳만 보이고, 결과 줄에는 검색 중이라는 말도 없습니다.
          // (검색칸을 치기 시작하면 상태 고름을 푸는 것과 짝입니다. 둘 중 나중 것이 이깁니다.)
          if (S.ui.count && S.ui.q) {
            if (document.activeElement === $('q')) $('q').blur();
            S.ui.q = '';
            $('q').value = '';
            S.ui.search = false;
          }
          S.sel = null;
          navCommit(countOff);
          render(false);
          showResults(false);
          return;
        }
        if (t.hasAttribute('data-zone')) {
          var fromPick = !!t.closest('#zone-panel');
          if (fromPick) S.zpick = false;
          S.ui.zone = t.getAttribute('data-zone');
          // 여유 · 보통 같은 상태 고름은 그대로 둡니다(그 구역 안에서 거름 — 결과 줄이 구역과 곳 수를 알림).
          navCommit(!S.ui.zone);
          render(false);
          revealTab();
          showResults(true);
          if (fromPick) {
            // 패널의 줄은 사라졌으니 초점을 고른 탭으로(전체를 골랐으면 '전체' 탭).
            var pressed = $('tabs').querySelector('[aria-pressed="true"]');
            if (pressed) { try { pressed.focus({ preventScroll: true }); } catch (err) { pressed.focus(); } }
          }
          return;
        }
        if (t.hasAttribute('data-zone-go')) {
          // 구역별 현황의 한 줄: 한눈에는 그대로 두고 그 구역의 타일로. 검색칸이 (검색어 없이) 열려 있으면
          // 닫습니다 — 검색칸이 열린 동안에는 구역 고름이 걸리지 않습니다(visible()).
          if (S.ui.search || S.ui.q) { S.ui.search = false; S.ui.q = ''; $('q').value = ''; }
          S.ui.zone = t.getAttribute('data-zone-go');
          S.ui.count = '';
          S.sel = null;
          navCommit(false);
          render(false);
          revealTab();
          showResults(true);
          // 누른 줄은 사라졌으니 초점을 그 구역의 첫 타일로 옮깁니다(키보드 · 화면 읽기).
          var first = $('list').querySelector('.tile');
          if (first) { try { first.focus({ preventScroll: true }); } catch (err) { first.focus(); } }
          return;
        }
        if (t.hasAttribute('data-view')) {
          S.ui.view = t.getAttribute('data-view');
          render(false);
          navCommit(false);   // 보기 바꿈은 칸을 쌓지 않습니다(한눈에 상세가 닫혔으면 지금 칸만 고침)
          return;
        }
        if (t.hasAttribute('data-sort')) {
          S.ui.sort = t.getAttribute('data-sort');
          render(false);
          return;
        }
        if (t.classList.contains('row__main')) {
          var li = t.closest('.row'), id = li.getAttribute('data-id');
          var open = !S.open[id];
          if (open) { S.open[id] = true; S.lastRow = id; } else delete S.open[id];
          t.setAttribute('aria-expanded', open ? 'true' : 'false');
          li.querySelector('.row__more').hidden = !open;
          navCommit(!open);
          return;
        }
        if (t.classList.contains('tile')) {
          selectTile(t.getAttribute('data-id'), t);
          return;
        }
        if (t.hasAttribute('data-go')) { goRow(t.getAttribute('data-go')); return; }

        switch (t.getAttribute('data-act') || t.id) {
          case 'clear-count':
            clearCount();
            break;
          case 'here-close':
            S.hereGone = true;
            // 주소의 ?b= 를 뗍니다(뒤로 가기 기록이 있으면 그 칸을 거두고, 없으면 지금 칸만 고침).
            // 예시 화면이면 ?demo=1 은 남깁니다. 지우면 다음 새로 고침에 실제 화면으로 바뀝니다.
            if (NAV.ready) navCommit(true);
            else {
              try { history.replaceState(null, '', location.pathname + (core.isMock ? '?demo=1' : '')); } catch (err) { /* file:// 등 */ }
            }
            render(false);
            break;
          case 'sort-wait':
            S.ui.sort = 'wait';
            S.ui.view = 'list';
            S.ui.count = '';
            S.ui.zone = '';
            navCommit(false);
            render(false);
            $('controls').scrollIntoView({ block: 'start', behavior: smooth() });
            break;
          case 'map':
            // 타일을 다시 만들지 않고 그림만 펼치고 접습니다.
            S.mapOpen = !S.mapOpen;
            var fig = $('map-fig'), img = fig && fig.querySelector('img');
            if (S.mapOpen && img && !img.getAttribute('src') && img.getAttribute('data-src')) {
              img.setAttribute('src', img.getAttribute('data-src'));
            }
            if (fig) fig.hidden = !S.mapOpen;
            t.setAttribute('aria-expanded', S.mapOpen ? 'true' : 'false');
            t.innerHTML = '<i class="sq" aria-hidden="true"></i>' + (S.mapOpen ? '실제 배치도 닫기' : '실제 배치도 보기');
            break;
          case 'zone-pick':
            if (S.zpick) closePick(false); else openPick();
            break;
          case 'search-open': closePick(false); openSearch(); break;
          case 'search-cancel':
            if (S.multi) closeSearch(true);
            else { S.ui.q = ''; $('q').value = ''; render(false); $('q').focus(); }
            break;
          case 'sheet-close': closeSheet(true); break;
          case 'demo-exit':
            // 실제 화면은 새로 연 페이지에서 처음부터 그립니다. 이 페이지에서 모드만 바꾸면 예시 값이
            // 기억(S)에 남아 실제 값과 섞일 수 있습니다. replace 라 뒤로 가기에 예시 화면이 끼지 않습니다.
            location.replace(location.pathname);
            break;
          case 'refresh':
          case 'retry':
            resume(true);
            // 받는 동안 목록 자리의 단추를 '다시 불러오는 중…' 으로 바꿉니다(failHtml 이 busy 를 봅니다).
            // 끝나면 성공은 목록으로, 실패는 refresh() 의 render 로 '다시 불러오기' 로 돌아옵니다.
            if (!S.hasData) render(false);
            break;
        }
      });

      $('q').addEventListener('input', function () {
        S.ui.q = this.value;
        S.sel = null;
        // 검색은 구역처럼 상태 고름(여유 · 혼잡 ...)과도 겹쳐 걸지 않습니다. 겹치면 '혼잡' 을
        // 눌러 둔 채 여유 부스 'A-01' 을 찾을 때 '찾는 부스가 없어요' 가 나오고, 결과 줄도
        // '혼잡 부스만 보는 중' 에 머물러 검색 결과 수가 보이지 않습니다. 검색칸은 목록 중간의
        // 붙박이 줄에서 열려 위의 눌린 단추가 안 보이니, 치기 시작하면 상태 고름을 풉니다.
        if (S.ui.count && norm(this.value)) { S.ui.count = ''; navCommit(false); }
        render(false);
        // 검색 단추는 붙박이 줄에 있어 목록 한가운데서도 열 수 있습니다. 목록이 짧아지면
        // 브라우저는 스크롤 위치만 줄여서, 결과 줄과 가장 잘 맞는 앞쪽 부스가 화면 위로
        // 숨습니다. 결과 줄이 붙박이 줄 아래에 오면 더 움직이지 않으니 글자마다 튀지 않습니다.
        // 치는 동안에는 부드럽게 움직이면 다음 글자와 겹치므로 바로 옮깁니다.
        showResults(true, true);
      });
      $('search').addEventListener('submit', function (e) {
        e.preventDefault();
        $('q').blur(); // 휴대폰 자판을 내려 결과가 보이게
      });
      $('tabs').addEventListener('scroll', tabsFade, { passive: true });
      window.addEventListener('resize', tabsFade);
      window.addEventListener('resize', function () { if (S.zpick) fitPick(); });

      document.addEventListener('keydown', function (e) {
        if (S.zpick && /^(ArrowDown|ArrowUp|Home|End)$/.test(e.key) && document.activeElement &&
            document.activeElement.closest && document.activeElement.closest('#zone-panel')) {
          var rows = Array.prototype.slice.call($('zone-panel').querySelectorAll('.zpick__row'));
          var i = rows.indexOf(document.activeElement);
          var j = e.key === 'Home' ? 0 : e.key === 'End' ? rows.length - 1 :
            Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
          e.preventDefault();
          rows[j].focus();
          return;
        }
        if (e.key !== 'Escape' && e.key !== 'Esc') return;
        if (S.zpick) { closePick(true); return; }
        if (!$('sheet').hidden) { closeSheet(true); return; }
        if (S.ui.search && document.activeElement === $('q')) { closeSearch(true); return; }
        var row = openRow();
        if (row) { closeRow(row.id); return; }
        if (S.ui.count && liveOn()) clearCount();
      });
      window.addEventListener('popstate', function (e) {
        var st = e.state;
        if (!st || st.v !== NAV_V) return;   // 이 화면이 만든 칸이 아님(손대지 않음)
        NAV.i = st.n;
        NAV.list[st.n] = st;
        navApply(st, true);
      });

      // 가려지면 받기를 멈추고(잡아 둔 차례를 지움), 다시 보이면 곧바로 받습니다.
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { clearTimeout(timer); timer = null; return; }
        S.visibleSince = Date.now();
        render(false);
        resume(false);
      });
      // 뒤로 가기 캐시(bfcache)에서 되살아난 페이지는 멈춰 있던 차례가 없으니 다시 받습니다.
      window.addEventListener('pageshow', function (e) { if (e.persisted) { S.visibleSince = Date.now(); resume(false); } });
      window.addEventListener('offline', function () { S.navOffline = true; render(false); });
      window.addEventListener('online', function () { S.navOffline = false; render(false); resume(false); });
    }

    /* ── 시작 ─────────────────────────────────────────────────── */
    // 운영 포털에 함께 올라간 이 화면의 사본으로 열렸는가. 그 사이트에는 /api/live-snapshot 이 없어
    // 대기 현황을 받을 수 없으므로, 설정의 visitorSiteUrl(공식 관람객 주소)로 옮깁니다. 부스 Live
    // 사이트의 배포본은 이 값이 './'(같은 사이트)라 옮기지 않습니다. 협의용 예시(?demo)는 서버를
    // 읽지 않으니 그대로 둡니다. 이 컴퓨터에서 저장소를 그대로 띄워도(dev-server) 포털 설정을 읽으므로
    // 옮겨집니다 — 실제 화면은 live/build.sh 로 만든 배포본이나 ?demo 로 봅니다.
    function officialUrl() {
      if (core.isMock || !cfg.visitorSiteUrl) return null;
      var u;
      try { u = new URL(cfg.visitorSiteUrl, location.href); } catch (e) { return null; }
      if (u.protocol !== 'https:' || u.origin === location.origin) return null;
      if (S.hereParam) u.searchParams.set('b', S.hereParam);
      return u.href;
    }

    function moveTo(url) {
      // 옮기는 동안(또는 막혔을 때) 빈 화면 대신 안내와 링크를 둡니다.
      document.title = '부스 대기 현황';
      $('main').innerHTML = '<div class="col"><div class="empty empty--none"><p class="empty__d">' +
        '부스 대기 현황 공식 화면으로 이동하고 있어요.</p>' +
        '<a class="line-btn" href="' + esc(url) + '">공식 화면 열기</a></div></div>';
      location.replace(url);
    }

    function start() {
      try {
        var b = new URLSearchParams(location.search).get('b');
        if (b && b.length <= 80) S.hereParam = b;
      } catch (e) { S.hereParam = null; }
      var go = officialUrl();
      if (go) { moveTo(go); return; }
      S.navOffline = navigator.onLine === false;
      navStart();
      // 협의용 예시 화면: 맨 위 띠 · 안내 · 나가기 단추를 켭니다. 주소로만 정해지고 이 페이지를
      // 연 동안 바뀌지 않습니다(BoothCore.isMock). 붙박이 줄은 띠 아래로 내립니다(visitor.css).
      if (core.isMock) {
        document.documentElement.classList.add('is-demo');
        $('demobar').hidden = false;
        $('demoinfo').hidden = false;
        $('demoexit').hidden = false;
      }
      // 지난번에 받은 결과가 있으면 서버를 기다리지 않고 먼저 그립니다(꾸며낸 값이 아닌 실제로 받았던 값).
      var snap = core.snapshot();
      if (snap) {
        S.settings = snap.settings || {};
        S.zones = snap.zones || [];
        S.liveReady = snap.liveReady;
        take(snap.booths);
      }

      bind();
      render(true);
      refresh();
      // 운영 시간 · 연결 지연은 받지 않아도 시간이 흐르며 바뀝니다.
      setInterval(function () { if (!document.hidden) render(false); }, TICK_MS);
      // 시연: 다른 탭(부스 운영자 화면)에서 값을 바꾸면 바로 다시 읽습니다.
      core.onDemoChange(function () { resume(true); });
    }

    start();
  })();
  </script>
</body>
</html>
