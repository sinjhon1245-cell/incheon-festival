<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>부스 대기 현황 · 2026 인천 AI미래채움 교육페스티벌</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#5B45E0" />
  <link rel="icon" href="data:," />
  <link rel="canonical" href="https://incheon-live.vercel.app/" />
  <!--
    운영 포털(GitHub Pages)의 관람객 화면 주소를 공식 관람객 Live 로 보내는 진입 페이지입니다.
    예전에는 여기서도 관람객 화면을 그렸지만(Supabase 를 직접 읽음), 이제 관람객 화면은
    부스 Live 사이트(Vercel · CDN 스냅샷) 한 곳에서만 그립니다 — 행사 당일 요청이 Supabase 로
    바로 몰리지 않게. 주소는 assets/config.js 의 visitorSiteUrl 과 같습니다(바꿀 때 함께).
    주소의 값은 공개 값만 골라 옮깁니다: ?demo=1(협의용 예시) · ?b=부스(부스 앞 안내 QR).
    그 밖의 값과 # 뒤는 옮기지 않습니다. 스크립트가 없어도 1초 뒤 첫 화면으로, 또는 단추로 갑니다.
  -->
  <noscript><meta http-equiv="refresh" content="1;url=https://incheon-live.vercel.app/" /></noscript>
  <style>
    :root { --ink: #16203C; --muted: #5C6989; --accent: #5B45E0; --bg: #FFFFFF; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui,
        'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    .eyebrow { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
    h1 { margin: 6px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
    .lead { margin: 12px 0 0; font-size: 16px; line-height: 1.55; }
    .go {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 22px;
      padding: 0 20px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
    }
    .go:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .url { margin: 14px 0 0; font-size: 13px; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">2026 인천 AI미래채움 교육페스티벌</p>
    <h1>부스 대기 현황</h1>
    <p class="lead">관람객 Live 화면으로 이동합니다.</p>
    <a class="go" id="go" href="https://incheon-live.vercel.app/">관람객 Live 열기</a>
    <p class="url">incheon-live.vercel.app</p>
  </main>
  <script>
    (function () {
      'use strict';
      var OFFICIAL = 'https://incheon-live.vercel.app/';
      var target = OFFICIAL;
      try {
        var here = new URLSearchParams(window.location.search);
        var keep = new URLSearchParams();
        if (here.get('demo') === '1') keep.set('demo', '1');
        var b = here.get('b');
        if (b && /^[A-Za-z0-9-]{1,40}$/.test(b)) keep.set('b', b);
        var q = keep.toString();
        if (q) target = OFFICIAL + '?' + q;
      } catch (e) { target = OFFICIAL; }
      var link = document.getElementById('go');
      link.href = target;
      // 이 파일이 공식 주소 자체에서 열리면(그럴 일은 없지만) 같은 곳으로 다시 보내지 않습니다.
      var sameSite = false;
      try { sameSite = window.location.origin === new URL(OFFICIAL).origin; } catch (e) { sameSite = false; }
      if (!sameSite) setTimeout(function () { window.location.replace(target); }, 700);
    })();
  </script>
</body>
</html>
